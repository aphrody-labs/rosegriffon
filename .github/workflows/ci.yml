name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun:
    name: install, typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck and lint
        run: bun run turbo run typecheck lint --continue
      - name: Build
        run: bun run turbo run build --continue
      - name: Compile rosegriffon (no site)
        run: bun run compile --site=skip
      - name: Smoke test
        run: ./dist/rosegriffon-linux-x64 --help

  rust:
    name: aphrody-rg-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
