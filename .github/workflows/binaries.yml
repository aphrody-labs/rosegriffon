name: rosegriffon binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example v1.4.4)
        required: true

permissions:
  contents: write

jobs:
  compile:
    name: rosegriffon-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, file: rosegriffon-linux-x64 }
          - { os: windows-latest, target: windows-x64, file: rosegriffon-windows-x64.exe }
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Public build-time configuration of the site (no secrets): repository variables.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Install
        run: bun install --frozen-lockfile
      - name: Compile (site embedded)
        shell: bash
        run: bun run compile --target ${{ matrix.target }} --site=build
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.file }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum rosegriffon-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "rosegriffon $TAG" --notes "Self-hostable rosegriffon executables (site, unified API, Discord gateway, ranked, cron)." --target "$GITHUB_SHA"
          gh release upload "$TAG" dist/rosegriffon-* dist/SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
