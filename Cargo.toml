[workspace]
resolver = "2"
members = [
  "crates/aphrody-nie-app",
  "crates/aphrody-nie-asm",
  "crates/aphrody-nie-bench",
  "crates/aphrody-nie-bevy",
  "crates/aphrody-nie-camera",
  "crates/aphrody-nie-cli",
  "crates/aphrody-nie-computer-use",
  "crates/aphrody-nie-core",
  "crates/aphrody-nie-data",
  "crates/aphrody-nie-editor",
  "crates/aphrody-nie-explore",
  "crates/aphrody-nie-ffi",
  "crates/aphrody-nie-forge",
  "crates/aphrody-nie-formats",
  "crates/aphrody-nie-game",
  "crates/aphrody-nie-geom",
  "crates/aphrody-nie-headless",
  "crates/aphrody-nie-identity-source",
  "crates/aphrody-nie-index",
  "crates/aphrody-nie-inventory",
  "crates/aphrody-nie-launcher",
  "crates/aphrody-nie-lua",
  "crates/aphrody-nie-lua-web",
  "crates/aphrody-nie-mcp",
  "crates/aphrody-nie-model-core",
  "crates/aphrody-nie-model-serve",
  "crates/aphrody-nie-net",
  "crates/aphrody-nie-ocgen",
  "crates/aphrody-nie-pe",
  "crates/aphrody-nie-pe-inspect",
  "crates/aphrody-nie-pg",
  "crates/aphrody-nie-play",
  "crates/aphrody-nie-queue",
  "crates/aphrody-nie-render",
  "crates/aphrody-nie-render3d",
  "crates/aphrody-nie-runtime",
  "crates/aphrody-nie-save",
  "crates/aphrody-nie-seed",
  "crates/aphrody-nie-sql",
  "crates/aphrody-nie-tasks",
  "crates/aphrody-nie-trace",
  "crates/aphrody-nie-ui",
  "crates/aphrody-nie-video",
  "crates/aphrody-nie-viola",
  "crates/aphrody-nie-wasm",
  "crates/aphrody-nie-wiki",
  "crates/aphrody-nie-zukan",
  "crates/aphrody-softraster",
  "crates/nie-pkg",
  "crates/nie-pkg-ui",
  "crates/re",
  "crates/yolo-re-bin-format",
  "crates/yolo-re-core",
  "crates/yre-worker",
]

[workspace.package]
version = "1.4.7"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/aphrody-dev/rosegriffon"
homepage = "https://aphrody.com"
authors = ["aphrody-dev <contact@aphrody.com>"]


[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[workspace.dependencies]
serde-wasm-bindgen = "0.6"

vello = "0.11.0"

anyhow = { version = "1.0.104", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
eframe = { version = "0.36.2", default-features = false }
libc = { version = "0.2.190", default-features = false }
log = { version = "0.4.34", default-features = false }
png = { version = "0.18.1", default-features = false }
rayon = { version = "1.12.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "1.0.154", default-features = false, features = [
  "std",
] }
sha2 = { version = "0.11.1", default-features = false }
tempfile = { version = "3.27.0", default-features = false, features = [
  "getrandom",
] }
thiserror = { version = "2.0.21", default-features = false }
tracing = { version = "0.1.44", default-features = false }
windows = { version = "0.62.2", default-features = false }

# Vendored crates carried by PdfCraft (patch notes in apps/pdfcraft/vendor/README.md).
# DesignCraft's former winit git patch (skylartaylor/winit 3d51077) is superseded by this vendored copy.
# Dependencies absorbed from iecode.
bevy = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_asset = { version = "0.20.1", default-features = false }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_image = { version = "0.20.1", default-features = false, features = [
  "bevy_reflect",
] }
bevy_math = { version = "0.20.1", default-features = false }
bevy_mesh = { version = "0.20.1", default-features = false }
bevy_reflect = { version = "0.20.1", default-features = false }
bevy-wgpu-types = { package = "wgpu-types", version = "30.0.1", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = [
  "std",
  "wgsl",
  "vulkan",
  "gles",
  "dx12",
  "metal",
  "web",
  "webgpu",
] }
bun-steam = { git = "https://github.com/aphrody-dev/steam-depot", rev = "d098b41687a63767ee5eee3a351b2936a1d902e6", package = "steam-depot", default-features = false }
parking_lot = "0.12.3"
bytemuck = { version = "1.0", features = [
  "derive",
  "extern_crate_alloc",
  "min_const_generics",
] }
clap = { version = "4", features = ["derive", "env"] }
console_error_panic_hook = "0.1.5"
futures-lite = "2"
js-sys = { version = "0.3.106", default-features = false }
pollster = "1.0"
rusqlite = { version = "0.40" }
wasm-bindgen = { version = "0.2.129", default-features = false }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.104", default-features = false }
web-time = "1.1"
crc32fast = { version = "1.5", default-features = false }
cridecoder = { version = "0.2.3", default-features = false }
aphrody-re = { package = "yolo-re-core", path = "crates/yolo-re-core", version = "1.4.8" }
aphrody-nie-geom = { path = "crates/aphrody-nie-geom", version = "1.4.7" }
aphrody-nie-tasks = { default-features = false, path = "crates/aphrody-nie-tasks", version = "1.4.7" }
aphrody-nie-pe-inspect = { path = "crates/aphrody-nie-pe-inspect", version = "1.4.7" }
image_dds = { version = "0.7", default-features = false }
memmap2 = { version = "0.9" }
aphrody-nie-app = { default-features = false, path = "crates/aphrody-nie-app", version = "1.4.7" }
aphrody-nie-asm = { default-features = false, path = "crates/aphrody-nie-asm", version = "1.4.7" }
aphrody-nie-bench = { default-features = false, path = "crates/aphrody-nie-bench", version = "1.4.7" }
aphrody-nie-camera = { default-features = false, path = "crates/aphrody-nie-camera", version = "1.4.7" }
aphrody-nie-computer-use = { default-features = false, path = "crates/aphrody-nie-computer-use", version = "1.4.7" }
