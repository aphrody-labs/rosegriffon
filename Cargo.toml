lz4_flex = "0.14"

[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v8.6.0" }
bun-re = { path = "crates/re" }

# Workspace development profile: line tables for backtraces without heavy DWARF debuginfo bloat.
# Accelerates compilation and linking by ~2x and reduces target directory volume by ~60%.
[profile.dev]
debug = 1
opt-level = 0

[profile.test]
debug = 1
opt-level = 0


# Browser emulation builds (packages/bun-engine/web-emulation): whole-program optimisation for
# wasm32-unknown-unknown; wasm-bindgen and wasm-opt -O3 run afterwards.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false

# Craft browser apps (apps/webos/build-craft.ts): smallest download; wasm-bindgen and wasm-opt -Oz run afterwards.
[profile.web-craft]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false


