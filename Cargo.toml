aphrody-nie-editor = { default-features = false, path = "crates/aphrody-nie-editor", version = "1.4.7" }
aphrody-nie-explore = { default-features = false, path = "crates/aphrody-nie-explore", version = "1.4.7" }
aphrody-nie-forge = { default-features = false, path = "crates/aphrody-nie-forge", version = "1.4.7" }
aphrody-nie-formats = { default-features = false, path = "crates/aphrody-nie-formats", version = "1.4.7" }
aphrody-nie-headless = { default-features = false, path = "crates/aphrody-nie-headless", version = "1.4.7" }
aphrody-nie-index = { default-features = false, path = "crates/aphrody-nie-index", version = "1.4.7" }
aphrody-nie-lua = { default-features = false, path = "crates/aphrody-nie-lua", version = "1.4.7" }
