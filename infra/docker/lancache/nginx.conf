# Steam content cache. Cache rules follow lancachenet/monolithic overlay/etc/nginx
# (sites-available/cache.conf.d/root/*.conf), reduced to the Steam CDN.
worker_processes auto;
error_log /data/logs/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 4096; multi_accept on; }

http {
  log_format cachelog '[$time_local] $remote_addr "$request" $status $body_bytes_sent '
                      '"$upstream_cache_status" "$host" "$http_range"';
  access_log /data/logs/access.log cachelog;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 300s;
  client_max_body_size 0;

  # 1 MiB slices, keys in 250 MiB of shared memory, up to 1 TB on disk, kept for a year.
  proxy_cache_path /data/cache levels=2:2 keys_zone=steam:250m inactive=365d
                   max_size=1000g use_temp_path=off;

  resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
  resolver_timeout 10s;

  server {
    listen 80 reuseport;
    server_name _;

    location = /lancache-heartbeat {
      add_header X-LanCache-Processed-By $hostname;
      return 204;
    }

    # Steam probes this before trusting the cache.
    location = /server-status {
      proxy_pass http://$host$request_uri;
    }

    location / {
      if ($http_x_lancache_processed_by = $hostname) { return 508; }
      proxy_set_header X-LanCache-Processed-By $hostname;
      add_header X-LanCache-Processed-By $hostname;

      slice 1m;
      proxy_cache steam;
      proxy_ignore_headers Expires Cache-Control;
      proxy_cache_valid 200 206 3560d;
      proxy_cache_valid 301 302 0;
      proxy_set_header Range $slice_range;
      proxy_cache_lock on;
      proxy_cache_lock_age 2m;
      proxy_cache_lock_timeout 1h;
      proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
      proxy_cache_revalidate on;
      proxy_cache_bypass $arg_nocache;
      proxy_max_temp_file_size 40960m;
      # Steam chunk URLs are content-addressed: the query string (auth tokens) is not part of the key.
      proxy_cache_key steam$uri$slice_range;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_ignore_client_abort on;
      proxy_next_upstream error timeout http_404;
      proxy_pass http://$host$request_uri;

      add_header X-Upstream-Cache-Status $upstream_cache_status;
    }
  }
}
