# SPDX-License-Identifier: Apache-2.0
# Edge role (fr2, /etc/nginx/sites/rosegriffon.fr.conf): TLS for every Rose Griffon name, then the
# prod stack nginx over the WireGuard mesh. Vhost routing stays in the stack (infra/docker/nginx).
# Cert: /etc/nginx/certs/rosegriffon.fr (wildcard *.rosegriffon.fr) until the shared fleet ACME lands.

upstream rg_prod_stack {
    server 10.200.77.5:18080 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name rosegriffon.fr *.rosegriffon.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rosegriffon.fr *.rosegriffon.fr;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 64m;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://rg_prod_stack;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
    }
}
