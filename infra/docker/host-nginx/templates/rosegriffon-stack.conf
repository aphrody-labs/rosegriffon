# SPDX-License-Identifier: Apache-2.0
# Host nginx on prd (the production host, infra/docker/README.md): the public TLS entry for
# the rosegriffon names, thin proxies to the stack nginx on 127.0.0.1:18080 (compose.yaml),
# which carries the routing, cache, rate limits and the /raw, /vfs, /depot 404 contract.
# cdn.rosegriffon.fr is public on the cdn host (infra/docker/cdn-edge/); here it is only the
# origin the edge fetches from (allow-listed).
#
#   sudo install -m 644 infra/docker/host-nginx/rosegriffon-stack-proxy.inc /etc/nginx/snippets/
#   sudo install -m 644 infra/docker/host-nginx/cloudflare-realip.conf /etc/nginx/conf.d/
#   sudo install -m 644 infra/docker/host-nginx/rosegriffon-stack.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
# Port 8443: on prd the public 80/443 belong to the shenron-gateway container (host network).
# Cloudflare reaches 8443 through the zone Origin Rule "rosegriffon prd origin port"
# (http_request_origin phase, infra/docker/README.md); HTTP->HTTPS is Cloudflare's job.
# Certificate: one lineage `rosegriffon.fr` (certbot dns-cloudflare) covering every name below.

map $http_upgrade $rg_stack_connection {
    default upgrade;
    '' close;
}

upstream rg_stack {
    server 127.0.0.1:18080;
    keepalive 64;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    listen 9443 ssl; # Cloudflare caches 9443, not 8443: edge stale copy while prd is down (src infra/cloudflare/cloudflare.toml aphrody-origin-cacheable-port)
    listen [::]:9443 ssl;
    http2 on;
    server_name ${RG_VHOSTS:website};
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    include snippets/rosegriffon-stack-proxy.inc;
    client_max_body_size 25m;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name ${RG_VHOSTS:core};
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    include snippets/rosegriffon-stack-proxy.inc;
    client_max_body_size 10m;
}


# Origin for the cdn edge (infra/docker/cdn-edge/): only the cdn host may fetch from here;
# the public cdn.rosegriffon.fr record points at the cdn host.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name ${RG_VHOSTS:nginx};
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    allow 51.255.162.6;
    allow 10.200.77.0/24;
    deny all;
    include snippets/rosegriffon-stack-proxy.inc;
}
