# SPDX-License-Identifier: Apache-2.0
# Host nginx on vps (stays the public TLS entry for every vhost): thin proxies from the
# rosegriffon names to the stack nginx on 127.0.0.1:18080 (compose.yaml), which carries the
# routing, cache, rate limits and the /raw, /vfs, /depot 404 contract.
# Replaces /etc/nginx/conf.d/rg-core.conf and rosegriffon.fr.conf at cutover (README.md).
#
#   sudo install -m 644 infra/docker/host-nginx/rosegriffon-stack.conf /etc/nginx/conf.d/
#   sudo rm /etc/nginx/conf.d/rg-core.conf /etc/nginx/conf.d/rosegriffon.fr.conf
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $rg_stack_connection {
    default upgrade;
    '' close;
}

upstream rg_stack {
    server 127.0.0.1:18080;
    keepalive 64;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rosegriffon.fr www.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    include snippets/rosegriffon-stack-proxy.inc;
    client_max_body_size 25m;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ranked.rosegriffon.fr api.rosegriffon.fr bot.rosegriffon.fr cdn.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rg-core/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rg-core/privkey.pem;
    include snippets/rosegriffon-stack-proxy.inc;
    client_max_body_size 10m;
}

server {
    listen 80;
    listen [::]:80;
    server_name rosegriffon.fr www.rosegriffon.fr ranked.rosegriffon.fr api.rosegriffon.fr bot.rosegriffon.fr cdn.rosegriffon.fr;
    return 301 https://$host$request_uri;
}
