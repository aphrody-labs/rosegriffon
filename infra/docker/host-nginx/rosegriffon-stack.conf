# SPDX-License-Identifier: Apache-2.0
# Host nginx on prd (the production host, infra/docker/README.md): the public TLS entry for
# the rosegriffon names, thin proxies to the stack nginx on 127.0.0.1:18080 (compose.yaml),
# which carries the routing, cache, rate limits and the /raw, /vfs, /depot 404 contract.
# cdn.rosegriffon.fr is served by the cdn host (infra/docker/cdn-edge/), not here.
#
#   sudo install -m 644 infra/docker/host-nginx/rosegriffon-stack-proxy.inc /etc/nginx/snippets/
#   sudo install -m 644 infra/docker/host-nginx/cloudflare-realip.conf /etc/nginx/conf.d/
#   sudo install -m 644 infra/docker/host-nginx/rosegriffon-stack.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificate: one lineage `rosegriffon.fr` (certbot dns-cloudflare) covering every name below.

map $http_upgrade $rg_stack_connection {
    default upgrade;
    '' close;
}

upstream rg_stack {
    server 127.0.0.1:18080;
    keepalive 64;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rosegriffon.fr www.rosegriffon.fr achillea.rosegriffon.fr azalee.rosegriffon.fr shop.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    include snippets/rosegriffon-stack-proxy.inc;
    client_max_body_size 25m;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ranked.rosegriffon.fr api.rosegriffon.fr bot.rosegriffon.fr mcp.rosegriffon.fr db.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    include snippets/rosegriffon-stack-proxy.inc;
    client_max_body_size 10m;
}

server {
    listen 80;
    listen [::]:80;
    server_name rosegriffon.fr www.rosegriffon.fr achillea.rosegriffon.fr azalee.rosegriffon.fr shop.rosegriffon.fr ranked.rosegriffon.fr api.rosegriffon.fr bot.rosegriffon.fr mcp.rosegriffon.fr db.rosegriffon.fr;
    return 301 https://$host$request_uri;
}
