# rosegriffon.fr (port of infra/nginx/rosegriffon.fr.conf): website service.

server {
    include /etc/nginx/snippets/tls.inc;
    server_name www.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    return 301 https://rosegriffon.fr$request_uri;
}

server {
    include /etc/nginx/snippets/tls.inc;
    server_name rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    client_max_body_size 25m;

    # Hashed build assets: served by Next, cached here for a year.
    location ^~ /_next/static/ {
        proxy_pass http://rg_website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache nie_derived;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://rg_website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rg_connection;
        proxy_read_timeout 120s;
    }
}
