# rosegriffon.fr (port of infra/nginx/rosegriffon.fr.conf): website service.
# TLS ends at the host nginx, which proxies here (127.0.0.1:18080).

server {
    listen 8080;
    server_name www.rosegriffon.fr;
    return 301 https://rosegriffon.fr$request_uri;
}

server {
    listen 8080;
    # achillea, azalee and shop are host-routed by the website (as on the systemd host nginx).
    server_name rosegriffon.fr achillea.rosegriffon.fr azalee.rosegriffon.fr shop.rosegriffon.fr;
    client_max_body_size 25m;

    # Hashed build assets: served by Next, cached here for a year.
    location ^~ /_next/static/ {
        proxy_pass http://rg_website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache nie_derived;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://rg_website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $rg_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rg_connection;
        proxy_read_timeout 120s;
    }
}
