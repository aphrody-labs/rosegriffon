# SPDX-License-Identifier: Apache-2.0
# Port of infra/nginx/rg-core.conf + the host snippets/nie-assets.inc, same public contract.
#   ranked.rosegriffon.fr, api.rosegriffon.fr  core: Colyseus wss + REST, unified API
#   bot.rosegriffon.fr                         core: /health, /<profil>/... bot admin
#   cdn.rosegriffon.fr                         nginx: /static (from /data/cdn), media;
#                                              model-serve: derived assets (proxy_cache)
# TLS ends at the host nginx (infra/nginx/*.conf), which proxies every rosegriffon name here.

server {
    listen 8080;
    server_name ranked.rosegriffon.fr api.rosegriffon.fr mcp.rosegriffon.fr db.rosegriffon.fr;
    access_log /var/log/nginx/rg-stats.log rg_stats buffer=32k flush=5s;
    # Dispute proofs are uploaded as text-encoded images up to 8 MiB.
    client_max_body_size 10m;

    location / {
        proxy_pass http://rg_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $rg_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rg_connection;
        # Colyseus rooms stay open for a whole match.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 8080;
    server_name bot.rosegriffon.fr;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://rg_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $rg_proto;
        proxy_read_timeout 60s;
    }
}

server {
    listen 8080;
    server_name cdn.rosegriffon.fr;
    access_log off;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /health {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"status":"ok","service":"rosegriffon-cdn"}\n';
    }

    # Heavy public media written by cron (RG_MEDIA_ROOT, mounted read-only at /data/media):
    # same URL shape as Supabase Storage. Missing objects fall back to Supabase Storage.
    location ~ ^/storage/v1/object/public/(tweets|assets)/(.+)$ {
        root /data/media;
        try_files /$1/$2 @storage;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location @storage {
        set $supabase xzwfnxzkxtcpgmtqulbh.supabase.co;
        proxy_pass https://$supabase;
        proxy_http_version 1.1;
        proxy_set_header Host $supabase;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase;
        # Supabase answers 400 NoSuchKey for a missing object: serve a real 404.
        proxy_intercept_errors on;
        error_page 400 = @storage_absent;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location @storage_absent {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 404 '{"statusCode":"404","error":"not_found","message":"Object not found"}';
    }

    # Derived public assets (boot cache, PNG, GLB, WAV): host /srv/rosegriffon/cdn/static,
    # mounted read-only. nginx answers byte-range requests on static files natively.
    location ^~ /static/ {
        alias /data/cdn/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Legacy layout used by the site: `/dx11/<vfs>.png` is the decoded texture `/tex/dx11/<vfs>.png`.
    location ~ ^/dx11/.+\.png$ {
        rewrite ^ /tex$uri break;
        include /etc/nginx/snippets/model-serve-proxy.inc;
    }

    # Cut-in camera tracks (`.g4cm`) are the only raw game bytes the site reads. Kept before the
    # /raw deny below (the first matching regex wins), as in the host configuration.
    location ~ ^/raw/.+\.g4cm$ {
        include /etc/nginx/snippets/model-serve-proxy.inc;
    }

    # Original game bytes, listing of the installed game, project source: never public.
    location ~ ^/(raw|vfs|depot)(/|$) {
        return 404;
    }

    # Converted downloads: derived formats only (model-serve defaults `/export/` to raw).
    location ^~ /export/ {
        if ($args !~ "^format=(png|webp|gif|jpg|bmp|tga|tiff|qoi|json|glb|wav|mp4|webm|h264|m2v)(&id=[0-9]+)?$") {
            return 404;
        }
        include /etc/nginx/snippets/model-serve-proxy.inc;
    }

    # Everything else: derived assets decoded on demand (models, textures, cfg.bin JSON, audio).
    location / {
        include /etc/nginx/snippets/model-serve-proxy.inc;
    }
}
