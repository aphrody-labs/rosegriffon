# Zones, cache and the Cloudflare real-IP list (ported from the host
# /etc/nginx/conf.d/{00-nie-zones,04-proxy-cache}.conf).

limit_req_zone $binary_remote_addr zone=nie_assets:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=nie_conn:10m;

# /var/cache/nginx is the bind mount ${RG_SRV_ROOT}/cache/nginx.
proxy_cache_path /var/cache/nginx/nie levels=1:2 keys_zone=nie_derived:64m max_size=40g inactive=30d use_temp_path=off;

# Audience stream read by the `stats:achillea` cron task (tab-separated, see its parser).
log_format rg_stats escape=json
    '$time_iso8601\t$host\t$request_method\t$uri\t$status\t$body_bytes_sent\t'
    '$request_time\t$upstream_response_time\t$upstream_cache_status\t'
    '$http_referer\t$http_user_agent\t$remote_addr';

map $http_upgrade $rg_connection {
    default upgrade;
    '' close;
}

# Upstreams: 00-upstreams.conf, generated from infra/services.toml (`just render`).

# The only client is the host nginx (TLS, Cloudflare real IP already resolved there): trust its
# X-Real-IP so the rate limits key on the visitor, not on the Docker gateway.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
real_ip_header X-Real-IP;

map $http_x_forwarded_proto $rg_proto {
    default $http_x_forwarded_proto;
    '' http;
}

# Plain HTTP: container health probe, then redirect every public name to HTTPS.
server {
    listen 8080 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
