# Zones, cache, upstreams and the Cloudflare real-IP list (ported from the host
# /etc/nginx/conf.d/{00-nie-zones,cloudflare-realip,04-proxy-cache}.conf).

limit_req_zone $binary_remote_addr zone=nie_assets:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=nie_conn:10m;

ssl_session_cache shared:rg_tls:10m;

# /var/cache/nginx is the bind mount /srv/rosegriffon/cache/nginx.
proxy_cache_path /var/cache/nginx/nie levels=1:2 keys_zone=nie_derived:64m max_size=40g inactive=30d use_temp_path=off;

# Audience stream read by the `stats:achillea` cron task (tab-separated, see its parser).
log_format rg_stats escape=json
    '$time_iso8601\t$host\t$request_method\t$uri\t$status\t$body_bytes_sent\t'
    '$request_time\t$upstream_response_time\t$upstream_cache_status\t'
    '$http_referer\t$http_user_agent\t$remote_addr';

map $http_upgrade $rg_connection {
    default upgrade;
    '' close;
}

upstream rg_core {
    server core:8810;
    keepalive 32;
}

upstream rg_website {
    server website:3100;
    keepalive 32;
}

upstream model_serve {
    server model-serve:8792;
    keepalive 16;
}

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Plain HTTP: container health probe, then redirect every public name to HTTPS.
server {
    listen 8080 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
