# L'unité pointait `/home/ubuntu/niers/packages/azalee-tools/src/server/main.ts`,
# un module qui n'existe plus : `azalee-tools` a été absorbé par `packages/azalee`
# du dépôt `rg`, dont la CLI porte la sous-commande `serve`. Le service bouclait
# donc sur « Module not found » — 414 redémarrages — et `api.rosegriffon.fr/azalee/`
# répondait 502.
#
# `ExecStart=` vide d'abord : sans cette ligne, systemd AJOUTE la nouvelle
# commande à l'ancienne au lieu de la remplacer.
[Service]
WorkingDirectory=/home/ubuntu/rg
ExecStart=
ExecStart=/home/ubuntu/.bun/bin/bun packages/azalee/src/cli.ts serve --port ${AZALEE_PORT} --host 127.0.0.1
