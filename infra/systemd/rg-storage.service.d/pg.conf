# `WorkingDirectory=/home/ubuntu/niers` fait charger automatiquement par Bun le
# fichier `.env.local` de ce dépôt, qui pose `PGDATABASE=postgres`, `PGUSER=ubuntu`
# et `PGHOST=/var/run/postgresql`. Ces variables l'emportent sur la base nommée
# dans `DATABASE_URL` : le service se connectait donc à la base `postgres`, où le
# schéma `storage` n'existe pas, et répondait 500 sur CHAQUE fichier — toutes les
# images du site en 502 derrière nginx.
#
# On fixe donc explicitement les variables PG* ici : l'environnement du service
# l'emporte sur les fichiers `.env`, et l'unité ne dépend plus de son répertoire
# de travail. Réversible : supprimer ce fichier et `systemctl daemon-reload`.
[Service]
Environment=PGHOST=127.0.0.1
Environment=PGPORT=5432
Environment=PGUSER=rg
Environment=PGDATABASE=rg
