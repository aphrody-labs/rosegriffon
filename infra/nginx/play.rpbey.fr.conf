# play.rpbey.fr — Discord Activity gacha client (statique Vite/PixiJS)
#
# Servi depuis /var/www/play.rpbey.fr (rsync dist/ après build).
# CORS Discord : map $cors_origin dans nginx.conf (global).
# Déployer : bun scripts/deploy-infra.ts --play

# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name play.rpbey.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name play.rpbey.fr;

    ssl_certificate     /etc/letsencrypt/live/play.rpbey.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.rpbey.fr/privkey.pem;
    ssl_early_data on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # CORS Discord Activity (map globale nginx.conf)
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    if ($request_method = OPTIONS) { return 204; }

    root /var/www/play.rpbey.fr;
    index index.html;

    access_log /var/log/nginx/play.rpbey.fr.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/play.rpbey.fr.error.log warn;

    # Assets hashés Vite — cache immutable 1 an
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        try_files $uri =404;
        access_log off;
    }

    # SPA fallback (Activity routes client-side)
    location / {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        try_files $uri $uri/ /index.html;
    }

    location ~* "\.(env|git/|sql|bak)$" { return 410; }
}