# ─── staging-nds — émulateur NDS bundlé, environnement de pré-évaluation ──
# Bind localhost uniquement. Zéro exposition publique tant que l'opérateur
# n'ouvre pas le listen en clair / ne crée pas le DNS / ne pose pas l'auth.
#
# Accès dev : SSH tunnel
#   ssh -L 8889:127.0.0.1:8889 ubuntu@<vps>
#   → http://localhost:8889
#
# Arbo servie :
#   /           → catalog/index.html (liste jeux)
#   /play/      → bundle dust (WASM + UI)
#   /roms/      → ROMs (non-indexables, headers noindex)
#
# Pour passer en prod (plus tard, non géré ici) :
#   - ajouter listen 443 ssl + server_name
#   - auth_basic ou Bearer token
#   - certbot DNS-01
#   - retirer le bind 127.0.0.1

server {
    listen 127.0.0.1:8889;
    server_name _;

    root /var/www/staging-nds;

    # Hardening : bloque indexation par moteurs
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    add_header Cache-Control "no-store" always;

    # Headers requis par dust (SharedArrayBuffer / WASM threads)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Security baseline
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # robots.txt inline (pas de fichier)
    location = /robots.txt {
        add_header Content-Type "text/plain";
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Racine → catalogue
    location = / {
        try_files /catalog/index.html =404;
    }

    location /catalog/ {
        try_files $uri =404;
        # pas d'autoindex
        autoindex off;
    }

    location /play/ {
        try_files $uri $uri/ =404;
        autoindex off;

        # Les workers et le .wasm ont besoin de COOP/COEP stricts
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        types {
            application/wasm wasm;
            application/javascript js mjs;
            text/css css;
            image/webp webp;
            image/svg+xml svg;
        }
    }

    location /roms/ {
        # ROMs confidentielles — accès seulement via catalog.
        # Bloque le listing et les requêtes directes depuis un User-Agent
        # bot/crawler. L'emu fetch via même origin → pas de Referer check.
        autoindex off;
        add_header Content-Disposition "inline" always;
        add_header X-Content-Type-Options "nosniff" always;

        types {
            application/octet-stream nds;
        }
    }

    # Tout le reste → 404
    location / {
        return 404;
    }

    # Logging confiné (n'utilise pas le access log global)
    access_log /var/log/nginx/staging-nds.access.log;
    error_log  /var/log/nginx/staging-nds.error.log;
}
