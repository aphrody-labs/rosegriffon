# RG production gateway. The service catalog owns hosts and loopback ports.
# TLS certificates are provisioned on the VPS; no credentials live in this file.

server {
    listen 80;
    server_name rosegriffon.fr www.rosegriffon.fr api.rosegriffon.fr cdn.rosegriffon.fr achillea.rosegriffon.fr ranked.rosegriffon.fr supabase.rosegriffon.fr storage.rosegriffon.fr realtime.rosegriffon.fr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8811;
    server_name _;
    location = /health { return 200 'ok'; }
    location ^~ /rest/v1/ { proxy_pass http://127.0.0.1:8809/; }
    location ^~ /storage/v1/ { proxy_pass http://127.0.0.1:8810; }
    location ^~ /realtime/v1/ {
        proxy_pass http://127.0.0.1:8812;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    server_name rosegriffon.fr www.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rosegriffon.fr/privkey.pem;
    client_max_body_size 512m;
    location ^~ /rest/v1/ { proxy_pass http://127.0.0.1:8809/; }
    location ^~ /storage/v1/ { proxy_pass http://127.0.0.1:8810; }
    location ^~ /realtime/v1/ {
        proxy_pass http://127.0.0.1:8812;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ~ ^/llms?(-full)?\.(txt|md|html)$ {
        root /srv/rg/shared/cron/seo;
        try_files $uri @rg_website;
    }
    location @rg_website {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name api.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/api.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rosegriffon.fr/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name cdn.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/cdn.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.rosegriffon.fr/privkey.pem;
    client_max_body_size 512m;
    # Assets statiques publiés sur disque (rg-cron `cdn` pour /static/rg/public,
    # pipeline Azalée pour /static/azalee) : servis par nginx, jamais par rg-cdn.
    location ^~ /static/ {
        root /var/www/cdn;
        gzip_static on;
        brotli_static on;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:8801;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name achillea.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/achillea.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/achillea.rosegriffon.fr/privkey.pem;
    location ^~ /rest/v1/ { proxy_pass http://127.0.0.1:8809/; }
    location ^~ /storage/v1/ { proxy_pass http://127.0.0.1:8810; }
    location ^~ /realtime/v1/ {
        proxy_pass http://127.0.0.1:8812;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location = /health/check { proxy_pass http://127.0.0.1:4000; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 301 https://rosegriffon.fr/achillea; }
}

server {
    listen 443 ssl;
    server_name ranked.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/ranked.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ranked.rosegriffon.fr/privkey.pem;
    location = /health/check { proxy_pass http://127.0.0.1:4000; }
    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    server_name supabase.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/supabase.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.rosegriffon.fr/privkey.pem;
    client_max_body_size 512m;
    location ^~ /rest/v1/ { proxy_pass http://127.0.0.1:8809/; }
    location ^~ /storage/v1/ { proxy_pass http://127.0.0.1:8810; }
    location ^~ /realtime/v1/ {
        proxy_pass http://127.0.0.1:8812;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / { proxy_pass http://127.0.0.1:8809; }
}

server {
    listen 443 ssl;
    server_name storage.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/supabase.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.rosegriffon.fr/privkey.pem;
    client_max_body_size 512m;
    location / { proxy_pass http://127.0.0.1:8810; }
}

server {
    listen 443 ssl;
    server_name realtime.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/supabase.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.rosegriffon.fr/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8812;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
