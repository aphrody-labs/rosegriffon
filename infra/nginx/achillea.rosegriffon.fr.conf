# SPDX-License-Identifier: Apache-2.0
# achillea.rosegriffon.fr — ancienne adresse d'Achilléa, servie désormais par le site
# (https://rosegriffon.fr/achillea). Redirection permanente, chemin conservé.
# DNS: Cloudflare zone rosegriffon.fr, A achillea -> vps public address, proxied (SSL Full strict).
# TLS: Let's Encrypt `achillea.rosegriffon.fr` (certbot dns-cloudflare, /etc/letsencrypt/cloudflare.ini).
#
# Install:
#   sudo install -m 644 infra/nginx/achillea.rosegriffon.fr.conf /etc/nginx/conf.d/achillea.rosegriffon.fr.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name achillea.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/achillea.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/achillea.rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location = / {
        return 301 https://rosegriffon.fr/achillea;
    }

    location / {
        return 301 https://rosegriffon.fr/achillea$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name achillea.rosegriffon.fr;
    return 301 https://achillea.rosegriffon.fr$request_uri;
}
