# api.rpbey.fr — reverse-proxy vers Cloud Run (gacha + bot API)
#
# Prod serverless (2026-06+) :
#   /gacha/*  → rpbey-gacha (Colyseus REST + WSS)
#   /*        → rpbey-bot   (API HTTP dashboard / health / metrics)
#
# Les upstreams Cloud Run utilisent des noms DNS dynamiques → resolver + variable.
# Déployer : bun scripts/deploy-infra.ts

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name api.rpbey.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name api.rpbey.fr;

    ssl_certificate     /etc/letsencrypt/live/api.rpbey.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rpbey.fr/privkey.pem;
    ssl_early_data on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    access_log /var/log/nginx/api.rpbey.fr.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/api.rpbey.fr.error.log warn;
    client_max_body_size 12m;

    # Resolver global (nginx.conf) — requis pour proxy_pass variable HTTPS
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    set $gacha_upstream "rpbey-gacha-53utdy3fkq-ey.a.run.app";
    set $bot_upstream   "rpbey-bot-53utdy3fkq-ey.a.run.app";

    # Health gacha (public)
    location = /gacha/health {
        proxy_pass         https://$gacha_upstream/health;
        proxy_ssl_server_name on;
        proxy_set_header   Host $gacha_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # Gacha REST + Colyseus WSS (préfixe /gacha/ retiré côté upstream).
    # Avec proxy_pass sur variable ($gacha_upstream), nginx ne retire PAS
    # automatiquement le préfixe location — rewrite obligatoire (sinon upstream
    # reçoit POST / au lieu de /api/gacha/*).
    location /gacha/ {
        rewrite ^/gacha/?(.*)$ /$1 break;
        proxy_pass         https://$gacha_upstream;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host              $gacha_upstream;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # Bot API (Cloud Run — IAM public désactivé : le service valide BOT_API_KEY)
    location / {
        limit_req zone=rpb_api burst=50 nodelay;
        proxy_pass         https://$bot_upstream;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host              $bot_upstream;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}