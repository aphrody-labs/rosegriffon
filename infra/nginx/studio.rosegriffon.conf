# ══════════════════════════════════════════════════════════
# studio.rosegriffon.fr — Supabase Studio auto-hébergé
# ══════════════════════════════════════════════════════════
#
# Tableau de bord Supabase branché sur notre pile self-host
# (cf. docs/self-host-supabase.md) :
#
#   rg-studio   (conteneur) → 127.0.0.1:8815   interface Next
#   rg-pg-meta  (conteneur) → 127.0.0.1:8813   introspection Postgres
#                             127.0.0.1:8814   port d'admin de pg-meta,
#                                              non configurable (PG_META_PORT+1)
#
# ⚠ Studio donne un accès complet en écriture à la base : il est réservé à
# l'exploitation. D'où l'authentification HTTP basique
# (`/etc/nginx/studio.htpasswd`, identifiants dans `/etc/rg-studio.env`) ET des
# conteneurs qui n'écoutent que sur la boucle locale.
#
# Cert (une fois) :
#   sudo certbot certonly --webroot -w /var/www/html -d studio.rosegriffon.fr
#
# Activer :
#   sudo cp infra/nginx/studio.rosegriffon.conf /etc/nginx/conf.d/
#   sudo rm -f /etc/nginx/conf.d/studio-acme.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name studio.rosegriffon.fr;

    include /etc/nginx/conf.d/no-index.inc;

    ssl_certificate     /etc/letsencrypt/live/studio.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.rosegriffon.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/studio.rosegriffon.fr.access.log;
    include /etc/nginx/conf.d/rg-stats.inc;
    error_log  /var/log/nginx/studio.rosegriffon.fr.error.log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "no-referrer"                          always;

    # Imports SQL et téléversements depuis l'explorateur de stockage.
    client_max_body_size 512m;

    auth_basic           "Rose Griffon — Studio";
    auth_basic_user_file /etc/nginx/studio.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8815;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Certaines requêtes de l'éditeur SQL sont longues.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# ── HTTP → HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name studio.rosegriffon.fr;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
