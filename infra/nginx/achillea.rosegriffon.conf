# achillea-web — SPA Angular auto-hébergée sur le VPS (bascule Vercel→VPS : team Hobby
# soft-bloquée fair-use / Fluid CPU). Sert une VERSION FIGÉE + proxy /api -> bot local :4002.
# Realtime (socket.io/colyseus) = direct vers ranked.rosegriffon.fr (cf. environment.prod.ts).
#
# Déployer : bun run deploy:web            (versions figées, bascule atomique, retour arrière)
# État     : bun run deploy:status
# Cert     : sudo certbot certonly --webroot -w /var/www/html -d achillea.rosegriffon.fr
#
# La racine servie n'est plus /var/www/achillea mais un lien symbolique vers une
# version immuable, cf. docs/deploiement-sans-coupure.md. `/var/www/achillea`
# reste un lien vers cette même cible pour les anciens scripts.

# Racine servie + aiguillage de prévisualisation. Généré par scripts/ops/deploy.ts :
# c'est le SEUL endroit où nginx apprend quelle version est en production.
include /etc/nginx/achillea-slots/web_root.conf;

# Passerelle ranked (Colyseus + proxy JSON vers bot :4000)
# max_fails/fail_timeout : après 3 échecs le backend est marqué mort 15 s, nginx sert
# immédiatement la réponse d'indisponibilité au lieu de retenter un amont éteint à
# chaque requête (le bot redémarre chaque nuit et à chaque relance du watchdog).
upstream achillea_api {
    server 127.0.0.1:4002 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# Bot TSed direct — uploads binaires (multipart). Le gateway ranked lit le body
# via bun-serve-express en UTF-8 et corrompait les PNG (0x89 → U+FFFD).
upstream achillea_bot_direct {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=15s;
    keepalive 8;
}

# HTTP — ACME + redirection HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name achillea.rosegriffon.fr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS — SPA + proxy API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name achillea.rosegriffon.fr;

    ssl_certificate     /etc/letsencrypt/live/achillea.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/achillea.rosegriffon.fr/privkey.pem;

    root $achillea_root;
    index index.html;

    include /etc/nginx/conf.d/achillea-headers.inc;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json text/css image/svg+xml application/manifest+json;
    gzip_min_length 256;

    client_max_body_size 6M;

    # Indisponibilité du bot en JSON, pas en HTML : le seul appelant de /api est le
    # XHR de la SPA, à qui une page de maintenance ne sert à rien. La SPA elle-même
    # est statique — elle ne tombe pas avec le bot, donc elle reste chargée et peut
    # afficher son propre état dégradé. C'est l'adaptation du @maintenance de rg à
    # une façade statique plutôt qu'à un rendu serveur.
    location @api_indisponible {
        default_type application/json;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"ok":false,"error":"service_unavailable","hint":"le bot redemarre, reessayez dans quelques secondes","retryAfter":15}';
    }

    # Réservoir de fragments : les morceaux hachés des versions précédentes restent
    # joignables ici. Sans lui, un onglet ouvert avant une publication demande un
    # `chunk-<hash>.js` que la nouvelle version ne contient plus → erreur de
    # chargement de morceau côté Angular. Généré par scripts/ops/deploy.ts.
    location @reservoir {
        root /home/ubuntu/achillea-releases/web/static;
        # Pas de `expires` : il poserait un second Cache-Control à côté de celui-ci.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/achillea-headers.inc;
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    # Prévisualisation : pose (ou retire) le cookie qui aiguille vers la version en
    # relecture, sur le domaine public. Évite un sous-domaine + DNS + certificat par
    # version. Sans cookie, le comportement est rigoureusement inchangé.
    location = /__preview {
        if ($arg_off) {
            add_header Set-Cookie "achillea_preview=; Path=/; Max-Age=0; SameSite=Lax" always;
            return 302 /;
        }
        add_header Set-Cookie "achillea_preview=$arg_token; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }

    # Uploads images : bypass ranked → bot :4000 (corps binaire intact)
    # Path public /api/proxy/* → bot /proxy/* (controllers montés sur /)
    location ^~ /api/proxy/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://achillea_bot_direct;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
        # Fail-fast : 3 s pour se connecter à un port local. Au-delà le bot est mort,
        # pas lent — inutile de faire patienter 60 s.
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @api_indisponible;
        client_max_body_size 6M;
    }

    # /api -> ranked gateway (^~ : priorité sur les regex assets pour ne pas servir /api/*.json en fichier)
    location ^~ /api/ {
        proxy_pass http://achillea_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @api_indisponible;
    }

    location = /opengraph-image { try_files /opengraph-image.png =404; }

    # Fragments HACHÉS PAR CONTENU (`nom-ABCD1234.ext`) : version courante d'abord,
    # réservoir ensuite. Doit précéder la règle d'actifs générique ci-dessous —
    # nginx évalue les `location ~` dans l'ordre du fichier.
    #
    # Regex ENTRE GUILLEMETS obligatoirement : hors guillemets, nginx lit le `{` de
    # `{8,}` comme l'ouverture d'un bloc et rejette la directive.
    location ~ "-[A-Z0-9]{8,}\.(?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|webp|avif|gif|svg|ico|json|map)$" {
        try_files $uri @reservoir;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/achillea-headers.inc;
    }

    # Actifs NON hachés (logo.svg, favicon.ico, assets/…) : pas d'immutable, leur nom
    # ne change pas quand leur contenu change.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|webp|avif|gif|svg|ico|json|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/conf.d/achillea-headers.inc;
    }

    # SPA fallback — shell HTML non caché
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        include /etc/nginx/conf.d/achillea-headers.inc;
    }
}
