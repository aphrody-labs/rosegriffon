# ══════════════════════════════════════════════════════════
# supabase.rosegriffon.fr — pile Supabase auto-hébergée
# ══════════════════════════════════════════════════════════
#
# Point d'entrée public et neutre de la pile qui remplace Supabase Cloud
# (cf. docs/self-host-supabase.md). Quatre noms pour un même socle :
#
#   supabase.rosegriffon.fr   remplaçant exact de https://<ref>.supabase.co
#                             (/rest/v1, /storage/v1, /realtime/v1)
#   db.rosegriffon.fr         PostgREST seul        → 127.0.0.1:8809
#   storage.rosegriffon.fr    fichiers seuls        → 127.0.0.1:8810
#   realtime.rosegriffon.fr   flux SSE seul         → 127.0.0.1:8812
#
# Les mêmes routes restent servies sur l'origine de chaque application
# (infra/nginx/supabase-compat.inc) : c'est ce que `NEXT_PUBLIC_SUPABASE_URL`
# utilise, pour éviter le cross-origin et garder valides les URLs absolues déjà
# enregistrées en base. Ce vhost s'ajoute, il ne remplace rien.
#
# Cert (une fois, après création des enregistrements DNS) :
#   sudo certbot certonly --nginx \
#     -d supabase.rosegriffon.fr -d db.rosegriffon.fr \
#     -d storage.rosegriffon.fr -d realtime.rosegriffon.fr
#
# Activer :
#   sudo cp infra/nginx/supabase.rosegriffon.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx

# Origines autorisées à interroger la pile depuis un navigateur. La pile sert
# des données publiques sous RLS et n'utilise pas de cookies (l'authentification
# passe par un jeton porteur), donc `*` reste le réglage sûr et le plus simple.
map $http_origin $supabase_cors {
    default "*";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name supabase.rosegriffon.fr db.rosegriffon.fr storage.rosegriffon.fr realtime.rosegriffon.fr;

    include /etc/nginx/conf.d/no-index.inc;

    ssl_certificate     /etc/letsencrypt/live/supabase.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.rosegriffon.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/supabase.rosegriffon.fr.access.log;
    include /etc/nginx/conf.d/rg-stats.inc;
    error_log  /var/log/nginx/supabase.rosegriffon.fr.error.log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header Referrer-Policy           "no-referrer"                          always;

    # Uploads d'images (avatars, médias d'article).
    client_max_body_size 512m;

    # Bloque le bruit des scanners.
    location ~* "/(wp-(admin|login|content|includes)|wordpress|phpmyadmin|pma|cgi-bin)/" { return 410; }

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"supabase-self-host"}';
    }

    # ── db.rosegriffon.fr : PostgREST à la racine, sans préfixe ──
    location / {
        if ($host = storage.rosegriffon.fr) { return 404; }
        if ($host = realtime.rosegriffon.fr) { return 404; }
        # supabase.rosegriffon.fr n'expose rien à la racine : tout passe par
        # les préfixes /rest/v1, /storage/v1 et /realtime/v1 ci-dessous.
        if ($host = supabase.rosegriffon.fr) { return 404; }

        proxy_pass http://127.0.0.1:8809/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin   $supabase_cors always;
        add_header Access-Control-Expose-Headers "content-range, content-location, range-unit" always;
    }

    # ── storage.rosegriffon.fr : fichiers à la racine ──
    location ~ ^/(object|bucket)(/|$) {
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # ── realtime.rosegriffon.fr : flux SSE à la racine ──
    location = /stream {
        proxy_pass http://127.0.0.1:8812/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ── supabase.rosegriffon.fr : les trois surfaces sous leur préfixe ──
    include /etc/nginx/conf.d/supabase-compat.inc;
}

# ── HTTP → HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name supabase.rosegriffon.fr db.rosegriffon.fr storage.rosegriffon.fr realtime.rosegriffon.fr;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
