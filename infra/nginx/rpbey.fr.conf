# rpbey.fr — dashboard Next.js 16 (standalone :3002 derrière nginx).
# Source de vérité repo ; déployer via `bun scripts/deploy-infra.ts --web`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream rpbey_web { server 127.0.0.1:3002 max_fails=3 fail_timeout=15s; keepalive 32; }

# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name rpbey.fr www.rpbey.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://rpbey.fr$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name www.rpbey.fr;

    ssl_certificate     /etc/letsencrypt/live/rpbey.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpbey.fr/privkey.pem;
    ssl_early_data on;

    return 301 https://rpbey.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name rpbey.fr;

    ssl_certificate     /etc/letsencrypt/live/rpbey.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpbey.fr/privkey.pem;
    ssl_early_data on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    access_log /var/log/nginx/rpbey.fr.access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/rpbey.fr.error.log warn;
    client_max_body_size 25m;

    # Statiques Next hashés — offload nginx (cache immutable 1 an)
    location /_next/static/ {
        alias /home/ubuntu/rpbey/apps/web/.next/standalone/apps/web/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri @bunproxy;
    }

    # Assets public/ (images, data_bey, polices…) — offload nginx
    location ~* ^/(?:data_bey|data|images|icons|fonts|locales|manifest\.json|robots\.txt|sitemap\.xml|favicon\.ico)|.*\.(?:webp|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2|eot|webmanifest|txt|xml)$ {
        root /home/ubuntu/rpbey/apps/web/.next/standalone/apps/web/public;
        add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
        access_log off;
        try_files $uri @bunproxy;
    }

    location @bunproxy {
        proxy_pass http://rpbey_web;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Migration Vercel → VPS : purge cache + cookies navigateur (Clear-Site-Data).
    # Visiter une fois en navigation normale : https://rpbey.fr/__clear-site-data__
    location = /__clear-site-data__ {
        add_header Clear-Site-Data '"cache", "cookies", "storage"' always;
        add_header Cache-Control "no-store" always;
        return 302 https://rpbey.fr/;
    }

    location / {
        proxy_pass http://rpbey_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        # HTML/API dynamiques — ne pas réutiliser une réponse Vercel en cache navigateur
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~* "\.(env|git/|sql|bak)$" { return 410; }
}