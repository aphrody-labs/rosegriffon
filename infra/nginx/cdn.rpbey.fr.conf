# ══════════════════════════════════════════════════════════
# cdn.rpbey.fr — CDN RPB (static dashboard + fancaps proxy + uploads)
# ══════════════════════════════════════════════════════════
#
# Architecture serverless (2026-06+) :
#   - Lectures statiques → nginx direct (/var/www/cdn/static/rpb-dashboard, …)
#   - Fancaps → proxy_cache nginx → ant.fancaps.net / cdni.fancaps.net (90j)
#   - Uploads API → rg-cdn.service (:8804, partagé avec cdn.rosegriffon.fr)
#   - Assets repo → alias direct apps/cdn/assets/ (pas de Bun requis)
#
# Déployer : bun scripts/deploy-infra.ts
# Cert     : sudo certbot certonly --nginx -d cdn.rpbey.fr

proxy_cache_path /var/cache/nginx/fancaps
    levels=1:2
    keys_zone=fancaps_cache:64m
    max_size=8g
    inactive=90d
    use_temp_path=off;

upstream rpbey_cdn_api {
    server 127.0.0.1:8804;
    keepalive 4;
}

# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name cdn.rpbey.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name cdn.rpbey.fr;

    ssl_certificate     /etc/letsencrypt/live/cdn.rpbey.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.rpbey.fr/privkey.pem;
    ssl_early_data on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache          max=20000 inactive=120s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;
    brotli_static on;
    gzip_static   on;
    gzip_vary     on;

    access_log /var/log/nginx/cdn.rpbey.fr.access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/cdn.rpbey.fr.error.log warn;
    client_max_body_size 25m;

    root /var/www/cdn/images;

    # ── API uploads (rg-cdn :8804) ─────────────────────────────────────────
    location = /upload {
        limit_except POST { deny all; }
        proxy_pass         http://rpbey_cdn_api/upload;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    location ~ "^/images/[a-f0-9]{16}\.(png|jpg|webp|gif|svg)$" {
        limit_except DELETE { deny all; }
        proxy_pass         http://rpbey_cdn_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    location = /health {
        proxy_pass         http://rpbey_cdn_api/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # Uploads existants (hex id)
    location ~* "^/[a-f0-9]{16}\.(png|jpg|jpeg|webp|gif|svg)$" {
        expires off;
        etag off;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
        access_log off;
    }

    # ── Fancaps proxy (cache 90j) ────────────────────────────────────────────
    location ~ ^/fancaps-anime/(\d+)\.jpg$ {
        proxy_pass         https://ant.fancaps.net/$1.jpg;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host ant.fancaps.net;
        proxy_cache        fancaps_cache;
        proxy_cache_valid  200 90d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock   on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=7776000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    location ~ ^/fancaps-anime-full/(\d+)\.jpg$ {
        proxy_pass         https://cdni.fancaps.net/file/fancaps-animeimages/$1.jpg;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header   Host cdni.fancaps.net;
        proxy_cache        fancaps_cache;
        proxy_cache_valid  200 90d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock   on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=7776000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
    }

    # ── Assets repo (bundlés, lecture seule) ───────────────────────────────
    location ^~ /api/assets/rpb-dashboard/ {
        alias /home/ubuntu/rpbey/apps/cdn/assets/rpb-dashboard/;
        expires off;
        etag off;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
        access_log off;
    }

    location ^~ /api/assets/rpb-bey-library/ {
        alias /home/ubuntu/rpbey/apps/cdn/assets/rpb-bey-library/images/;
        expires off;
        etag off;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
        access_log off;
    }

    # ── Static dashboard data ────────────────────────────────────────────
    location ^~ /static/ {
        alias /var/www/cdn/static/;
        expires off;
        etag off;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        try_files $uri =404;
        access_log off;

        types {
            text/html                   html htm;
            text/css                    css;
            text/plain                  txt;
            application/javascript      js mjs;
            application/json            json map;
            application/manifest+json   webmanifest;
            image/avif                  avif;
            image/webp                  webp;
            image/svg+xml               svg;
            image/png                   png;
            image/jpeg                  jpg jpeg;
            image/gif                   gif;
            font/woff2                  woff2;
            video/mp4                   mp4;
            audio/mpeg                  mp3;
        }
    }
}