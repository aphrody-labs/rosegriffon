# Point d'entree Supabase Achillea interne, non active automatiquement.
# Il reste distinct de supabase-internal.conf (:8811), reserve a RG/Azalee.
server {
    listen 127.0.0.1:8823;
    server_name _;

    access_log /var/log/nginx/achillea-supabase-internal.access.log;
    error_log /var/log/nginx/achillea-supabase-internal.error.log;

    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"achillea-supabase-internal"}';
    }

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:8820/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    location /storage/v1/ {
        proxy_pass http://127.0.0.1:8821/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        client_max_body_size 6m;
    }

    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:8822/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
