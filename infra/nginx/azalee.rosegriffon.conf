# azalee.rosegriffon.fr — Next.js standalone :3003 derrière nginx (self-host VPS).
# + Résilience : fail-fast sur backend mort/figé → page de maintenance (au lieu d'un
#   504 brut nginx) pendant que azalee-watchdog.timer restart le service.
# Source de vérité repo : scripts/azalee.rosegriffon.conf. Les lignes « managed by
# Certbot » sont préservées (certbot ne réécrit que ses propres marqueurs au renouvellement).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# max_fails/fail_timeout : après 3 échecs, le backend est marqué down 15s → nginx
# sert immédiatement @maintenance au lieu de réessayer un upstream mort à chaque requête.
# Amont piloté par scripts/ops/deploy.ts (bascule bleu/vert sans coupure).
include /etc/nginx/rg-upstreams/azalee_web.conf;
include /etc/nginx/rg-upstreams/azalee_preview.conf;
server {
    server_name azalee.rosegriffon.fr 51.77.147.152;

    # L'application Next émet elle-même les cinq en-têtes de sécurité, CSP comprise —
    # c'est elle qui connaît ses domaines d'images, de polices et de scripts. Or, tant
    # que ce `server` ne posait AUCUN `add_header`, le bloc `http` de nginx.conf ajoutait
    # les siens par-dessus : le client recevait « X-Frame-Options: DENY » suivi de
    # « SAMEORIGIN », et « Referrer-Policy: strict-origin-when-cross-origin » suivi de
    # « no-referrer-when-downgrade ». Deux valeurs contradictoires que le navigateur
    # coalesce en une liste invalide, donc potentiellement ignorée : la protection
    # disparaissait au lieu de doubler.
    # Un seul `add_header` ici remplace tout l'héritage du niveau `http` (nginx remplace,
    # n'accumule pas) : l'application redevient la source unique. Celui-ci est choisi
    # utile et sans équivalent applicatif — il n'ajoute aucune politique concurrente.
    add_header X-DNS-Prefetch-Control "on" always;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Page de maintenance (servie sur 502/503/504 = backend injoignable/figé/redémarrage)
    location @maintenance {
        root /var/www/azalee-maintenance;
        try_files /maintenance.html =503;
        # Servi par nginx, sans backend : les en-têtes de l'application n'existent pas ici.
        include /etc/nginx/conf.d/rg-securite.inc;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
    }

    # Statiques Next hashés servis directement par nginx (offload Bun, cache 1 an immutable)
    location /_next/static/ {
        alias /home/ubuntu/rg-releases/azalee/static/;
        include /etc/nginx/conf.d/rg-securite.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @bunproxy;
    }
    location @bunproxy {
        proxy_pass http://$azalee_backend;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @maintenance;
    }
    include /etc/nginx/conf.d/supabase-compat.inc;
    # Prévisualisation : pose (ou retire) le cookie qui aiguille vers le slot B.
    # Généré par scripts/ops/deploy.ts.
    location = /__preview {
        if ($arg_off) {
            add_header Set-Cookie "rg_preview=; Path=/; Max-Age=0; SameSite=Lax" always;
            return 302 /;
        }
        add_header Set-Cookie "rg_preview=$arg_token; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }


    location / {
        proxy_pass http://$azalee_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fail-fast : connexion 3s, lecture 30s (backend figé → maintenance, pas 60s d'attente)
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @maintenance;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/azalee.rosegriffon.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/azalee.rosegriffon.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = azalee.rosegriffon.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name azalee.rosegriffon.fr 51.77.147.152;
    return 404; # managed by Certbot


}
