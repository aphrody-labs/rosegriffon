# azalee.rosegriffon.fr — Next.js standalone :3003 derrière nginx (self-host VPS).
# + Résilience : fail-fast sur backend mort/figé → page de maintenance (au lieu d'un
#   504 brut nginx) pendant que azalee-watchdog.timer restart le service.
# Source de vérité repo : infra/nginx/azalee.rosegriffon.conf. Les lignes « managed by
# Certbot » sont préservées (certbot ne réécrit que ses propres marqueurs au renouvellement).
map $http_upgrade $connection_upgrade {
    default upgrade;
    # Une valeur vide supprime l'en-tête Connection et rend effectif le pool
    # keepalive de l'upstream pour toutes les requêtes HTTP ordinaires.
    ''      '';
}

# max_fails/fail_timeout : après 3 échecs, le backend est marqué down 15s → nginx
# sert immédiatement @maintenance au lieu de réessayer un upstream mort à chaque requête.
# Amont piloté par scripts/ops/deploy.ts (bascule bleu/vert sans coupure).
include /etc/nginx/rg-upstreams/azalee_web.conf;
include /etc/nginx/rg-upstreams/azalee_preview.conf;
server {
    server_name azalee.rosegriffon.fr 51.77.147.152;

    # Multiplexe les chunks Next sur une connexion TLS unique.
    http2 on;
    # Réduit le coût CPU du HTML dynamique ; les assets hashés utilisent leurs
    # fichiers Brotli précompressés et ne sont pas affectés.
    brotli_comp_level 4;

    # L'application Next émet elle-même les cinq en-têtes de sécurité, CSP comprise —
    # c'est elle qui connaît ses domaines d'images, de polices et de scripts. Or, tant
    # que ce `server` ne posait AUCUN `add_header`, le bloc `http` de nginx.conf ajoutait
    # les siens par-dessus : le client recevait « X-Frame-Options: DENY » suivi de
    # « SAMEORIGIN », et « Referrer-Policy: strict-origin-when-cross-origin » suivi de
    # « no-referrer-when-downgrade ». Deux valeurs contradictoires que le navigateur
    # coalesce en une liste invalide, donc potentiellement ignorée : la protection
    # disparaissait au lieu de doubler.
    # Un seul `add_header` ici remplace tout l'héritage du niveau `http` (nginx remplace,
    # n'accumule pas) : l'application redevient la source unique. Celui-ci est choisi
    # utile et sans équivalent applicatif — il n'ajoute aucune politique concurrente.
    add_header X-DNS-Prefetch-Control "on" always;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Page de maintenance (servie sur 502/503/504 = backend injoignable/figé/redémarrage)
    location @maintenance {
        root /var/www/azalee-maintenance;
        try_files /maintenance.html =503;
        # Servi par nginx, sans backend : les en-têtes de l'application n'existent pas ici.
        include /etc/nginx/conf.d/rg-securite.inc;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        default_type text/html;
    }

    # Statiques Next hashés servis directement par nginx (offload Bun, cache 1 an immutable)
    location /_next/static/ {
        alias /home/ubuntu/rg-releases/azalee/static/;
        include /etc/nginx/conf.d/rg-securite.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @bunproxy;
    }
    location @bunproxy {
        proxy_pass http://$azalee_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        error_page 502 503 504 =503 @maintenance;
    }
    include /etc/nginx/conf.d/supabase-compat.inc;
    # Prévisualisation : pose (ou retire) le cookie qui aiguille vers le slot B.
    # Généré par scripts/ops/deploy.ts.
    location = /__preview {
        if ($arg_off) {
            add_header Set-Cookie "rg_preview=; Path=/; Max-Age=0; SameSite=Lax" always;
            return 302 /;
        }
        add_header Set-Cookie "rg_preview=$arg_token; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }


    # ── Pages de catalogue : micro-cache partagé ───────────────────────────────
    # Ces routes rendent un miroir de données de jeu qui ne bouge qu'aux imports, et
    # l'audit du 14/8/2026 les a trouvées en `no-store` : trois visites de /chara à la
    # suite coûtaient trois rendus complets (0,449 / 0,458 / 0,434 s). Une minute de
    # cache suffit à effacer la répétition sans que personne ne voie de contenu périmé.
    #
    # Un bloc séparé de `location /` parce que la mise en cache exige `proxy_buffering
    # on`, incompatible avec le streaming laissé actif pour tout le reste du site. Le
    # périmètre est donc restreint à des pages de HTML pur : ni WebSocket, ni SSE, ni
    # route d'authentification. Les garde-fous (cookie de session, `Set-Cookie` en
    # réponse) sont dans conf.d/00-rg-cache.conf.
    location ~ ^/(chara|skill|item|aura|passive|tactic|equipe|quete|news|stade|succes|niveau|drops|invocation|entraineur|capsule)(/|$) {
        proxy_pass http://$azalee_backend;
        include /etc/nginx/conf.d/azalee-proxy.inc;

        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 32k;
        proxy_cache rg_pages;
        proxy_cache_valid 200 301 1m;
        proxy_cache_valid 404 30s;
        # Les pages se déclarent `no-store` alors que leur contenu ne dépend d'aucune
        # session : c'est cette déclaration qu'on écarte. `Set-Cookie` reste respecté,
        # donc une réponse qui ouvre une session n'entre jamais dans le cache.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_bypass $rg_sans_cache $rg_methode_sans_cache;
        proxy_no_cache     $rg_sans_cache $rg_methode_sans_cache;
        # Un seul rendu quand dix visiteurs demandent la même page froide en même temps ;
        # les autres attendent son résultat au lieu de déclencher dix rendus.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # Backend mort ou en redémarrage : mieux vaut servir une page d'il y a deux
        # minutes que la page de maintenance.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Rg $upstream_cache_status always;

        error_page 502 503 504 =503 @maintenance;
    }

    location / {
        proxy_pass http://$azalee_backend;
        include /etc/nginx/conf.d/azalee-proxy.inc;
        proxy_buffering off;
        error_page 502 503 504 =503 @maintenance;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/azalee.rosegriffon.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/azalee.rosegriffon.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = azalee.rosegriffon.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name azalee.rosegriffon.fr 51.77.147.152;
    return 404; # managed by Certbot


}
