# azalee.rosegriffon.fr — production HTTPS config (Next.js standalone :3003).
# Nginx gère le SSL et sert les fichiers statiques de Next directement.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream azalee_web { server 127.0.0.1:3003; keepalive 32; }

server {
    server_name azalee.rosegriffon.fr;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Statiques Next hashés servis directement par nginx (offload Bun, cache 1 an immutable)
    location /_next/static/ {
        alias /home/ubuntu/rg/apps/azalee/.next/standalone/apps/azalee/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @bunproxy;
    }
    location @bunproxy { proxy_pass http://azalee_web; proxy_set_header Host $host; }

    location / {
        proxy_pass http://azalee_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/azalee.rosegriffon.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/azalee.rosegriffon.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = azalee.rosegriffon.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name azalee.rosegriffon.fr;
    return 404; # managed by Certbot
}
