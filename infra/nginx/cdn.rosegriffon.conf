# ══════════════════════════════════════════════════════════
# cdn.rosegriffon.fr — CDN multi-app (uploads + static Next)
# ══════════════════════════════════════════════════════════
#
# 2 surfaces :
#   1. /upload  + /images/<id>     : API uploads (proxy → Bun :8804, apps/cdn/server.ts)
#   2. /static/<app>/...           : assets statiques (azalee, website) — sert public/ + .next/static
#                                     pour décharger les builds Next.js
#
# Storage :
#   - /var/www/cdn/images/         : uploads API (pattern [a-f0-9]{16}.<ext>)
#   - /var/www/cdn/static/<app>/   : miroir public/ + .next/static (sync via scripts/ops/cdn-sync.ts)
#
# Best practices (cf. nginx/documentation /admin-guide/web-server) :
#   - sendfile + tcp_nopush + tcp_nodelay : transmission zero-copy optimale
#   - open_file_cache                     : descripteurs en RAM (gain énorme sur petits fichiers)
#   - expires 1y immutable + etag off     : cache navigateur permanent (cache-busted via hash dans le path)
#   - gzip_static                         : sert *.gz précompressé si présent (cdn-sync.ts génère)
#   - Cross-Origin-Resource-Policy        : compat COEP côté apps Next 16
#   - access_log off sur immutable        : économie I/O
#
# Cert (à exécuter une fois, avant d'activer ce vhost) :
#   sudo certbot certonly --nginx -d cdn.rosegriffon.fr
#
# Déployer :
#   sudo cp infra/nginx/cdn.rosegriffon.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#   bun scripts/ops/cdn-sync.ts azalee website

upstream cdn_backend {
    server 127.0.0.1:8804;
    keepalive 4;
}

# Service de variantes resize+webp (cache disque) — apps/cdn-variants, :8805.
# Sert les requetes /dx11/ et /g4tx/ AVEC un ?w=<largeur> en WebP redimensionne
# (galerie : 11,9 Mo PNG -> ~20-300 Ko WebP). SANS query, le serving direct reste
# inchange (dump disque / @cpk_live). cf. cdn-variants.service.
upstream cdn_variants {
    server 127.0.0.1:8805;
    keepalive 8;
}

upstream nie_model_serve {
    server 127.0.0.1:8790;
    keepalive 4;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name cdn.rosegriffon.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS
server {
    # reuseport déjà posé sur cdn.rpbey.fr (un seul reuseport par port:proto).
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name cdn.rosegriffon.fr;

    ssl_certificate     /etc/letsencrypt/live/cdn.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.rosegriffon.fr/privkey.pem;
    ssl_early_data on;

    # ── Security baseline (server-level — audit 2026-05-13) ────────────────
    # nginx drop TOUS les add_header parents dès qu'un add_header existe plus
    # inner. Les `location` avec leur propre add_header (ex: /static/, /upload)
    # doivent donc RE-déclarer ces 5 lignes (cf. CLAUDE.md « add_header pièges »).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # ── HTTP/3 advertisement ──
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # ── Static-serving best practices (vhost-scoped overrides des défauts globaux) ──
    sendfile           on;
    sendfile_max_chunk 1m;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65s;
    keepalive_requests 1000;

    # Descripteurs FD + métadonnées en RAM (gain massif sur 84 MiB de petits assets)
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Sert *.br précompressé si Accept-Encoding: br + fichier .br présent (priorité 1)
    # Sert *.gz précompressé si Accept-Encoding: gzip + fichier .gz présent (priorité 2)
    # cdn-sync.ts génère les 2 (brotli quality 11 + gzip level 9).
    brotli_static on;
    gzip_static   on;
    gzip_vary     on;

    # Logs allégés (buffer + flush)
    access_log /var/log/nginx/cdn.rosegriffon.fr.access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/cdn.rosegriffon.fr.error.log;

    # Upload max 25MB (cohérent avec apps/cdn/server.ts)
    client_max_body_size 25m;

    root /var/www/cdn/images;

    # ════════════════════════════════════════════════════════
    # SURFACE 1 — API uploads (proxy → Bun :8804)
    # ════════════════════════════════════════════════════════

    # POST /upload : proxy vers Bun
    location = /upload {
        limit_except POST { deny all; }
        proxy_pass         http://cdn_backend/upload;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    # DELETE /images/<id> : proxy vers Bun
    location ~ "^/images/[a-f0-9]{16}\.(png|jpg|webp|gif|svg)$" {
        limit_except DELETE { deny all; }
        proxy_pass         http://cdn_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
    }

    # GET /health : proxy vers Bun (sans cache)
    location = /health {
        proxy_pass         http://cdn_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # GET /<id>.<ext> : static immutable, CDN-friendly (uploads existants)
    location ~* "^/[a-f0-9]{16}\.(png|jpg|jpeg|webp|gif|svg)$" {
        # expires off : géré explicitement via Cache-Control unique (évite doublon header)
        expires off;
        etag off;
        # Bug nginx : add_header dans une location REMPLACE les add_header du server.
        # Il faut re-déclarer Alt-Svc + tous les headers de sécurité ici.
        add_header Alt-Svc                  'h3=":443"; ma=86400'                  always;
        add_header Cache-Control            "public, immutable, max-age=31536000"  always;
        add_header Access-Control-Allow-Origin   "*"                              always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                   always;
        add_header X-Content-Type-Options   "nosniff"                              always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options          "DENY"                                 always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        try_files $uri =404;
        access_log off;
    }

    # ════════════════════════════════════════════════════════
    # SURFACE 2 — Static Next.js (miroir public/ + .next/static)
    # ════════════════════════════════════════════════════════
    # /static/<app>/...   →  /var/www/cdn/static/<app>/...
    # Whitelist d'apps : azalee, website (étendre avec |dashboard si besoin)

    # SURFACE 5 — Streaming LIVE des assets depuis les CPK IEVR (iecode-cdn.service :8788).
    # g4tx -> PNG decode a la volee, AUCUN dump disque. C'est le but du projet : streamer les CPK.
    location /g4tx/ {
        # Variante resize+webp si ?w= present (vignettes legeres) — service :8805.
        # Le service lit la source via le decodeur live :8788 puis cache disque.
        if ($arg_w) {
            proxy_pass http://cdn_variants;
            break;
        }
        proxy_pass http://127.0.0.1:8788/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

        location ^~ /static/ {
        # Sécurise le scope (refuse toute autre app)
        location ~ "^/static/(?!azalee/|website/)" { return 404; }

        alias /var/www/cdn/static/;

        # Cache navigateur permanent — assets cache-bustés via .next/static (hash dans le nom)
        # ou via query string ?v= côté public/.
        # expires off : géré explicitement via Cache-Control unique (évite doublon header)
        expires off;
        etag off;
        # add_header dans location REMPLACE ceux du server (bug nginx) → re-déclare tout.
        add_header Alt-Svc                       'h3=":443"; ma=86400'                   always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"   always;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header X-Content-Type-Options        "nosniff"                              always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains"  always;
        add_header X-Frame-Options               "DENY"                                 always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        # Vary: Accept-Encoding émis par gzip_vary on (vhost-level)

        access_log off;

        # Fallback propre (404 plutôt que listing)
        try_files $uri =404;

        # MIME — un sous-bloc types {} OVERRIDE complètement /etc/nginx/mime.types,
        # donc on doit re-déclarer tout ce qu'on serve sous /static/<app>/.
        types {
            # Texte
            text/html                   html htm shtml;
            text/css                    css;
            text/plain                  txt;
            text/xml                    xml;
            text/cache-manifest         appcache;

            # JS / WASM / data
            application/javascript      js mjs;
            application/json            json map;
            application/manifest+json   webmanifest;
            application/wasm            wasm;
            application/octet-stream    bin exe dll iso dmg;

            # Fonts
            font/woff                   woff;
            font/woff2                  woff2;
            application/x-font-ttf      ttf;
            application/x-font-otf      otf;
            application/vnd.ms-fontobject eot;

            # Images
            image/avif                  avif;
            image/webp                  webp;
            image/svg+xml               svg svgz;
            image/png                   png;
            image/jpeg                  jpg jpeg;
            image/gif                   gif;
            image/x-icon                ico;

            # Audio / vidéo
            video/mp4                   mp4;
            video/webm                  webm;
            audio/mpeg                  mp3;
            audio/ogg                   ogg oga;
        }
    }

    # ════════════════════════════════════════════════════════
    # SURFACE 7 — Inazuma Eleven Cross assets locaux (statiques)
    # ════════════════════════════════════════════════════════
    # Sert les assets et voix audio de jp.co.level5.inazumacross extraits
    # en statique depuis /var/www/cdn/cross/.
    location ^~ /cross/ {
        alias /var/www/cdn/cross/;

        expires off;
        etag off;
        add_header Alt-Svc                       'h3=":443"; ma=86400'                   always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"   always;
        add_header Access-Control-Allow-Origin   "*"                                     always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                          always;
        add_header X-Content-Type-Options        "nosniff"                               always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains"   always;
        add_header X-Frame-Options               "DENY"                                  always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"       always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        access_log off;
        try_files $uri =404;

        types {
            image/png                   png;
            image/webp                  webp;
            image/jpeg                  jpg jpeg;
            audio/wav                   wav;
            application/json            json;
            font/woff                   woff;
            font/woff2                  woff2;
            application/x-font-ttf      ttf;
            application/octet-stream    bin glb bundle acb awb acb_data awb_data;
            text/plain                  txt hash;
        }
    }

    # ════════════════════════════════════════════════════════
    # SURFACE 3 — IEVR DX11 assets (dump pré-extrait + fallback live)
    # ════════════════════════════════════════════════════════
    # Stratégie : try_files sert le dump pré-extrait (fichier disque) ;
    # si absent → @cpk_live proxifie vers iecode-cdn.service :8788 qui décode
    # l'asset à la volée depuis les CPK (G4TX→PNG lossless ou octets bruts).
    # Aucun dump préalable requis, aucune écriture disque.

    location ^~ /dx11/ {
        # Variante resize+webp si ?w= present (vignettes legeres galerie) — service
        # :8805. Court-circuite l'alias/try_files : le service lit la source (dump
        # disque OU decodeur live :8788) puis cache le webp sur disque. SANS ?w=,
        # le serving direct ci-dessous (dump -> @cpk_live) reste inchange.
        if ($arg_w) {
            proxy_pass http://cdn_variants;
            break;
        }

        alias /home/ubuntu/.local/share/Steam/iecode/inazuma/data/dx11/;

        # Cache navigateur permanent — assets immuables (buildid Steam).
        expires off;
        etag off;
        add_header Alt-Svc                       'h3=":443"; ma=86400'                  always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header X-Content-Type-Options        "nosniff"                              always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains"  always;
        add_header X-Frame-Options               "DENY"                                 always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        access_log off;
        # Fallback : dump disque → décodeur live si absent.
        try_files $uri @cpk_live;

        # MIME — types {} OVERRIDE complet, on liste uniquement ce qu'on serve.
        types {
            image/webp                  webp;
            image/avif                  avif;
            image/png                   png;
            image/jpeg                  jpg jpeg;
            image/x-dds                 dds;
            application/vnd.level5.g4tx g4tx;
            application/octet-stream    bin;
        }
    }

    # Décodeur live : sert tout asset /dx11/<path> absent du dump depuis les CPK.
    # iecode-cdn.service (Bun :8788) décode G4TX→PNG ou sert les octets bruts.
    location @cpk_live {
        proxy_pass         http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        # Les headers Cache-Control/CORS sont émis par le décodeur lui-même.
    }


    # ════════════════════════════════════════════════════════
    # SURFACE 4 — IEVR modèles 3D GLB (dump + fallback live)
    # ════════════════════════════════════════════════════════
    # /model/<basename>.glb  →  ~/data/dx11/model/<basename>.glb
    # Si absent → @cpk_live (le décodeur peut servir les fichiers bruts des CPK).

    location ^~ /model/ {
        alias /home/ubuntu/.local/share/Steam/iecode/inazuma/data/dx11/model/;

        # Cache navigateur permanent — assets immuables (rebuild via iecode cdn export-glb).
        expires off;
        etag off;
        add_header Alt-Svc                       'h3=":443"; ma=86400'                  always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header X-Content-Type-Options        "nosniff"                              always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options               "DENY"                                 always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        access_log off;
        # Fallback live pour les GLB non encore exportés.
        try_files $uri @cpk_live;

        # MIME — types {} OVERRIDE complet, on liste uniquement ce qu'on serve.
        types {
            model/gltf-binary           glb;
            model/gltf+json             gltf;
        }
    }


    # ════════════════════════════════════════════════════════
    # SURFACE 6 — Modèles 3D COMPLETS assemblés live (corps+face+uniforme)
    # ════════════════════════════════════════════════════════
    # /model-full/<code>.glb → nie-model-serve :8790 (assemble depuis CPK)
    # Cache disque côté service : second appel = lecture cache, sous-ms.

    location ^~ /model-full/ {
        # Serve depuis le cache disque si disponible (évite le proxy pour les hits).
        alias /home/ubuntu/niers/var/model-cache/;

        expires off;
        etag off;
        add_header Alt-Svc                       'h3=":443"; ma=86400'                  always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header X-Content-Type-Options        "nosniff"                              always;
        add_header Strict-Transport-Security     "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options               "DENY"                                 always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin"      always;
        add_header Permissions-Policy            "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

        access_log off;
        # Fallback : proxy vers le service d'assemblage live.
        try_files $uri @model_live;

        types {
            model/gltf-binary           glb;
        }
    }

    # Assemblage live : nie-model-serve :8790.
    location @model_live {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /model-chr/<sub>/<code>.glb -> nie-model-serve :8790 : modeles generiques des
    # sous-domaines common/chr/_<sub>/ (techniques `waza`, objets `item`, animaux `animal`).
    # Maillage g4md+g4mg assemble live (sans texture embarquee). Le service gere son cache
    # disque interne (`chr_<sub>_<code>.glb`) -> on proxy directement (pas d'alias fichier,
    # le nom de cache differe du chemin d'URL).
    location ^~ /model-chr/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        access_log off;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        proxy_hide_header  X-Content-Type-Options;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
        add_header X-Content-Type-Options        "nosniff"                              always;
    }

    # /tex/<vfs-path>.png -> nie-model-serve :8790 decode N'IMPORTE QUEL G4TX du VFS en PNG.
    # Les textures perso (face/uniforme/corps sous dx11/chr/) sont absentes du dump ET non
    # servies par le decodeur menu :8788 ; ce service a le decodeur nie-formats.
    location ^~ /tex/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        proxy_hide_header  X-Content-Type-Options;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header X-Content-Type-Options        "nosniff"                              always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /cfg/<vfs-path>.json -> nie-model-serve :8790 decode cfg.bin/objbin (RDBN/T2B) en JSON.
    location ^~ /cfg/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 30s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # /raw/<vfs-path> -> bytes bruts decompresses du CPK (texte, download).
    location ^~ /raw/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 30s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # /audio/<vfs-path> -> WAV PCM decode live (CRI HCA/ADX, ACB/AWB) depuis le CPK.
    location ^~ /audio/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /video/<vfs-path> -> MP4 fragmente (demux USM Sofdec2 + remux H.264) depuis le CPK.
    location ^~ /video/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, immutable, max-age=31536000"  always;
    }

    # /menu-render/<screen>.png -> rendu serveur Rust d'un ecran de menu (compositeur sprites).
    location ^~ /menu-render/ {
        proxy_pass         http://nie_model_serve$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_hide_header  Cross-Origin-Resource-Policy;
        proxy_hide_header  Cache-Control;
        add_header Access-Control-Allow-Origin   "*"                                    always;
        add_header Cross-Origin-Resource-Policy  "cross-origin"                         always;
        add_header Cache-Control                 "public, max-age=3600"                 always;
    }

    # ════════════════════════════════════════════════════════
    # Tout le reste → 404
    # ════════════════════════════════════════════════════════
    location / {
        return 404;
    }
}
