# azalee.rosegriffon.fr: redirection vers le wiki du portail (docs/deploy.md). Aucun service,
# aucun build : le frontend Azalée autonome est retiré.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name azalee.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/azalee.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azalee.rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location = / {
        return 301 https://rosegriffon.fr/wiki;
    }
    location / {
        return 301 https://rosegriffon.fr/wiki$request_uri;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name azalee.rosegriffon.fr;
    return 301 https://azalee.rosegriffon.fr$request_uri;
}
