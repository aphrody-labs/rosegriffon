# azalee.rosegriffon.fr — Azalée (infra/systemd/azalee-web.service, 127.0.0.1:3200).
# DNS: Cloudflare zone rosegriffon.fr, A azalee -> vps public address, proxied (SSL Full strict).
# TLS: Let's Encrypt `azalee.rosegriffon.fr` (certbot dns-cloudflare, /etc/letsencrypt/cloudflare.ini).
#
# Install:
#   sudo install -m 644 infra/nginx/azalee.rosegriffon.fr.conf /etc/nginx/conf.d/azalee.rosegriffon.fr.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name azalee.rosegriffon.fr;
    ssl_certificate /etc/letsencrypt/live/azalee.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azalee.rosegriffon.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    client_max_body_size 25m;

    location ^~ /_next/static/ {
        alias /home/ubuntu/apps/azalee/current/apps/azalee-web/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        include snippets/proxy-client-ip.inc;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name azalee.rosegriffon.fr;
    return 301 https://azalee.rosegriffon.fr$request_uri;
}
