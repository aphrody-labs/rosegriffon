# Micro-cache partagé des pages rendues par les applications Next.
#
# ── LE PROBLÈME MESURÉ ─────────────────────────────────────────────────────────
# L'audit du 14/8/2026 a relevé que 17 des 20 routes publiques d'azalée répondent
# `Cache-Control: private, no-cache, no-store` : chaque visite paie un rendu serveur
# complet. Trois tirs consécutifs sur les mêmes URL ne montrent aucune amélioration —
# /chara 0,449 / 0,458 / 0,434 s, /sons 0,337 / 0,410 / 0,444 s — ce qui confirme
# qu'aucun cache, ni applicatif ni partagé, n'existe entre nginx et le visiteur.
#
# La correction de fond est applicative (basculer les catalogues en ISR ; les pages
# lisant `searchParams` resteront dynamiques quoi qu'il arrive). Ce micro-cache traite
# l'autre moitié : deux visiteurs anonymes demandant la même page à dix secondes
# d'intervalle ne doivent pas déclencher deux rendus identiques.
#
# ── POURQUOI C'EST SÛR ─────────────────────────────────────────────────────────
# Trois barrières, et il suffit qu'une seule tienne :
#  1. `$rg_sans_cache` passe à 1 dès que la requête porte un cookie de session
#     better-auth, un cookie de prévisualisation ou un jeton : une page personnalisée
#     n'est ni lue ni écrite dans le cache.
#  2. nginx refuse par défaut de mettre en cache une réponse portant `Set-Cookie`, et
#     `Set-Cookie` n'est PAS dans `proxy_ignore_headers` ci-dessous : une réponse qui
#     ouvre une session ne peut pas être servie à quelqu'un d'autre.
#  3. Seules les réponses 200/301/404 sont conservées, et une minute au plus.
# `Cache-Control` et `Expires` sont ignorés — c'est le point du dispositif : les pages
# se déclarent `no-store` alors que leur contenu est un miroir de données de jeu qui ne
# change qu'aux imports. Une minute de décalage sur une fiche de personnage est sans
# conséquence ; le rendu répété, lui, se paie à chaque visite.
proxy_cache_path /var/cache/nginx/rg-pages
                 levels=1:2
                 keys_zone=rg_pages:32m
                 max_size=512m
                 inactive=10m
                 use_temp_path=off;

# Un seul cookie « intéressant » suffit à sortir du cache. La liste est volontairement
# large : mieux vaut ne pas cacher une page cachable que servir la page d'un compte à
# un autre visiteur.
map $http_cookie $rg_sans_cache {
    default 0;
    "~*(better-auth|session_token|rg_preview|__Secure-)" 1;
}

# Les méthodes autres que GET/HEAD ne sont jamais servies depuis le cache (`proxy_cache_methods`
# vaut GET HEAD par défaut) ; cette variable sert au `proxy_cache_bypass` des blocs qui
# proxifient une application.
map $request_method $rg_methode_sans_cache {
    default 1;
    GET     0;
    HEAD    0;
}
