# ══════════════════════════════════════════════════════════
# api.rosegriffon.fr — gateway outils internes (Rust + Bun)
# ══════════════════════════════════════════════════════════
#
# Cert (à exécuter une fois, avant d'activer ce vhost) :
#   sudo certbot certonly --nginx -d api.rosegriffon.fr
#
# Activer :
#   sudo cp infra/nginx/api.rosegriffon.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pattern : chaque outil interne écoute 127.0.0.1:<port>
#   n2b-server   → 8802  (futur, Rust)
#   shai-http    → 8803  (futur, Rust)
#   azalee-api   → 8807  (azalee-api.service, Bun — API headless du wiki,
#                          cf. packages/azalee/src/server/serve.ts)
#   rg-mcp       → 8808  (rg-mcp.service, Bun — serveur Model Context Protocol
#                          du monorepo, lecture seule, jeton porteur exigé,
#                          cf. packages/mcp + docs/mcp.md)
#   rag-api      → 8806  (rag-api.service, Bun — recherche RAG locale
#                          bun:sqlite, zéro dépendance Supabase à la requête,
#                          cf. docs/rag-unified.md)

# ── HTTPS — api.rosegriffon.fr ──
server {
    listen 443 ssl;
    http2 on;
    server_name api.rosegriffon.fr;

    ssl_certificate     /etc/letsencrypt/live/api.rosegriffon.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rosegriffon.fr/privkey.pem;

    # Logs dédiés
    access_log /var/log/nginx/api.rosegriffon.fr.access.log;
    error_log  /var/log/nginx/api.rosegriffon.fr.error.log;

    # Timeouts longs pour SSE / streaming Rust
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── Security baseline (audit 2026-05-13) ──────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "no-referrer"                          always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Bloque les chemins de scanners (.env, .git, wp-admin, …) — coupe le bruit.
    location ~* "\.(env|git/|aws/|ssh/|sql|bak|old|swp|DS_Store)$" { return 410; }
    location ~* "/(wp-(admin|login|content|includes)|wordpress|phpmyadmin|pma|cgi-bin)/" { return 410; }

    # ── n2b-server (futur) ──
    # location /n2b/ {
    #     proxy_pass http://127.0.0.1:8802/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     add_header X-Accel-Buffering no;
    # }

    # ── shai-http (futur) ──
    # location /shai/ {
    #     proxy_pass http://127.0.0.1:8803/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     add_header X-Accel-Buffering no;
    # }

    # ── azalee-api (API headless du wiki, @rose-griffon/azalee) ──
    # Lecture seule, JSON pur. Source de repli du CLI `azalee` et d'un GUI
    # Tauri quand la machine cliente n'a ni miroir SQLite ni dump du jeu.
    location /azalee/ {
        proxy_pass http://127.0.0.1:8807/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header X-Accel-Buffering no;
    }

    # ── rg-mcp (serveur MCP, @rose-griffon/mcp) ──
    # Point d'entrée MCP unique : un client Claude Code distant s'y connecte
    # en `--transport http` avec un jeton porteur. Deux `location =` exactes
    # (et non un préfixe) : la spec impose UN chemin, et `/mcp` sans slash
    # final ne serait pas capté par `location /mcp/`.
    location = /mcp {
        proxy_pass http://127.0.0.1:8808/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # Indispensable pour les réponses en flux (SSE) : sans cela nginx
        # tamponne les notifications de progression jusqu'à la fin.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering no;
    }

    location = /mcp/health {
        proxy_pass http://127.0.0.1:8808/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # ── rag-api (recherche RAG locale, bun:sqlite) ──
    location /rag/ {
        proxy_pass http://127.0.0.1:8806/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header X-Accel-Buffering no;
    }

    # ── Health global ──
    location = /health {
        return 200 '{"status":"ok","host":"api.rosegriffon.fr"}\n';
        add_header Content-Type application/json;
        access_log off;
    }

    # Tout le reste → 404
    location / {
        return 404 '{"error":"unknown service"}\n';
        add_header Content-Type application/json;
    }
}
