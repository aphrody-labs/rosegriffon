[package]
name = "aphrody-nie-tasks"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false
description = "Cancelable, pausable asynchronous job orchestration with progress reporting"

[lints]
workspace = true

[features]
default = ["host"]
host = ["dep:async-trait", "dep:tokio", "dep:tracing", "dep:uuid"]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
uuid = { version = "1.28.0", features = ["v4", "serde"], optional = true }
thiserror = "2.0.21"
tracing = { version = "0.1.44", optional = true }
serde = { version = "1.0.228", features = ["std", "derive"] }
serde_json = "1.0.154"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net"], optional = true }
