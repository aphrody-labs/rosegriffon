[package]
name = "aphrody-nie-mcp"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false
description = "Native stdio MCP server exposing the NIE host CLI"
autobins = false

[[bin]]
name = "aphrody-nie-mcp"
path = "src/main.rs"
required-features = ["host"]

[lints]
workspace = true

[features]
default = ["host"]
host = ["dep:anyhow", "dep:aphrody-nie-cli", "aphrody-nie-cli/host"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
aphrody-nie-cli = { path = "../aphrody-nie-cli", version = "1.4.8", default-features = false, optional = true }

[dev-dependencies]
aphrody-nie-pe = { path = "../aphrody-nie-pe" }
serde_json = { workspace = true }
