[package]
name = "aphrody-nie-play"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE.upstream"
publish = false
description = "Headless deterministic IE playthrough and CPU-rendered evidence generator"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "color", "env"] }
png = { workspace = true }
aphrody-nie-app = { path = "../aphrody-nie-app", version = "1.4.8" }
aphrody-nie-formats = { workspace = true, default-features = true }
aphrody-nie-core = { workspace = true }
aphrody-nie-runtime = { path = "../aphrody-nie-runtime", version = "1.4.8" }
rusqlite = { workspace = true, features = ["bundled"] }

[[bin]]
name = "aphrody-nie-play"
path = "src/main.rs"
