[package]
name = "aphrody-nie-core"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE.upstream"
publish = false
description = "Reverse-engineered Inazuma Eleven Victory Road data models and deterministic gameplay algorithms"

[lints]
workspace = true

[features]
default = ["data"]
serde = ["dep:serde", "aphrody-nie-geom/serde"]
data = ["dep:serde", "dep:serde_json", "aphrody-nie-geom/serde"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1.0.154", default-features = false, features = ["std"], optional = true }
aphrody-nie-data = { workspace = true, features = ["serde", "std"] }
aphrody-nie-geom = { workspace = true, features = ["std"] }
