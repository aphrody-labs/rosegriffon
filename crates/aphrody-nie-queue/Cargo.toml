[package]
name = "aphrody-nie-queue"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false
description = "Bounded deduplicated breadth-first frontiers for static NIE reverse-engineering workflows"

[lints]
workspace = true

[features]
default = []
host = ["dep:redis", "dep:thiserror"]

[dependencies]

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
redis = { version = "0.27.6", optional = true, features = ["r2d2"] }
thiserror = { workspace = true, optional = true }
