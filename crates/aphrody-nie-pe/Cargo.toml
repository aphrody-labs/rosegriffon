[package]
name = "aphrody-nie-pe"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
description = "Byte-exact PE64 model, complete image partitioning, rebuild and COFF object inspection for Inazuma Eleven RE"

[lints]
workspace = true

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
thiserror = { workspace = true }
sha2 = "0.10"
serde = { workspace = true, features = ["std", "derive"], optional = true }
