[package]
name = "aphrody-nie-seed"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
description = "Reverse-engineering knowledge ingestion for Inazuma Eleven binaries"

[lints]
workspace = true

[features]
default = ["host"]
host = ["dep:anyhow", "dep:aphrody-nie-index", "dep:rusqlite", "dep:tracing"]

[dependencies]
aphrody-nie-index = { workspace = true, optional = true, default-features = true }
aphrody-nie-formats = { workspace = true, default-features = false, features = [
  "std",
  "serde",
] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true, features = ["bundled"] }

[dev-dependencies]
tempfile = { version = "3.27.0", default-features = false, features = [
  "getrandom",
] }
