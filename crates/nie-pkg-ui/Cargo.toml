[package]
name = "nie-pkg-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"
publish = false
description = "Dioxus PoC of the NIE game library: registry list and feature matrix (SSR by default, desktop/web/native renderers behind features)"

[lints]
workspace = true

[features]
default = []
desktop = ["dioxus/desktop", "dioxus/launch"]
web = ["dioxus/web", "dioxus/launch"]

[dependencies]
nie-pkg = { path = "../nie-pkg" }
dioxus = { version = "0.7.10", default-features = false, features = [
  "macro",
  "html",
  "signals",
  "hooks",
] }
dioxus-ssr = { version = "0.7.10", default-features = false }
