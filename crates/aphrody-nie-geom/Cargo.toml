[package]
name = "aphrody-nie-geom"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE.upstream"
publish = false
description = "Small shared vector types required by the Inazuma Eleven RE model"

[lints]
workspace = true

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"], optional = true }
