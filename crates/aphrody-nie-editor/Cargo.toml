[package]
name = "aphrody-nie-editor"
default-run = "aphrody-nie-editor"
description = "Native NIE 3D editor with a shared DirectX 12, Vulkan, or OpenGL viewport"
version.workspace = true
edition.workspace = true
license-file = "../../docs/licenses/iecode/nie/LICENSE"
publish = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "aphrody-nie-editor"
path = "src/main.rs"
required-features = ["host"]

[features]
default = ["host"]
bevy = [
  "dep:bevy",
  "dep:aphrody-nie-bevy",
  "aphrody-nie-bevy/bevy",
  "aphrody-nie-render3d/bevy",
]
host = ["dep:clap", "bevy"]

[lints]
workspace = true

[dependencies]
aphrody-nie-render3d.workspace = true
aphrody-nie-ui = { path = "../aphrody-nie-ui", version = "1.4.8" }
aphrody-nie-bevy = { path = "../aphrody-nie-bevy", version = "1.4.7", optional = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true, optional = true, features = [
  "derive",
  "color",
  "env",
] }
bevy = { workspace = true, optional = true, features = [
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_render",
  "bevy_window",
  "bevy_winit",
  "x11",
  "wayland",
] }
