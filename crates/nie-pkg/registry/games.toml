# NIE game registry: every Inazuma Eleven game NIE knows about.
# One [[game]] per title; releases list every platform it shipped on.
# Feature support: full | partial | planned | none.
# Release years and regions are best-effort community data; fields marked
# `verified = false` still need a primary source check (docs/rust-migration/FEATURE-MATRIX.md).
# NIE never ships game content: `install` registers and hashes a dump the user owns.

schema = 1

[[game]]
id = "ie1"
title = "Inazuma Eleven"
series = "original"
revision = 1
features = { dump_verify = "full", asset_extract = "planned", text_extract = "planned", translation_patch = "planned", save_edit = "planned", team_builder = "planned", wiki_data = "partial", nie_runtime = "none", netplay = "none", mod_loader = "none" }
releases = [
  { platform = "ds", year = 2008, regions = ["jp", "eu"], format = "nds-rom", verified = true },
  { platform = "3ds", year = 2014, regions = ["eu"], format = "3ds-eshop", verified = false },
]
ecosystem = [
  { kind = "emulator", name = "melonDS", url = "https://melonds.kuribo64.net" },
  { kind = "tool", name = "Kuriimu2", url = "https://github.com/FanTranslatorsInternational/Kuriimu2" },
]

