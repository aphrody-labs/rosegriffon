[package]
name = "aphrody-nie-asm"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false
description = "Pure Rust x86-64 MSVC-dialect assembler used for binary reconstruction."

[lints]
workspace = true

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, features = ["std", "derive"], optional = true }
