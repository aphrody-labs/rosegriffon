[package]
name = "aphrody-nie-identity-source"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false
autobins = false
description = "Build a native Aphrody dossier from Inazuma Eleven game data"

[lints]
workspace = true

[features]
default = ["host"]
host = ["aphrody-nie-data/serde", "aphrody-nie-data/std"]

[dependencies]
aphrody-nie-data = { path = "../aphrody-nie-data", version = "1.4.8", features = ["serde", "std"] }
serde = { version = "1.0.228", features = ["std", "derive"] }
serde_json = "1.0.154"

[[bin]]
name = "export_aphrody"
path = "src/bin/export_aphrody.rs"
required-features = ["host"]

[dev-dependencies]
aphrody-identity = "1.4.7"
