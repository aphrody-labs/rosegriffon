[package]
name = "aphrody-nie-runtime"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false
description = "Deterministic headless IE match simulation and CPU renderer"

[lints]
workspace = true

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow", "dep:png", "dep:aphrody-nie-video"]

[dependencies]
aphrody-nie-core = { workspace = true }
aphrody-nie-formats = { workspace = true, features = ["std"] }
aphrody-nie-render3d = { path = "../aphrody-nie-render3d", version = "1.4.8", default-features = false }
aphrody-nie-video = { path = "../aphrody-nie-video", version = "1.4.8", optional = true }
aphrody-nie-geom = { workspace = true }
clap = { version = "4.5.58", features = ["derive", "color", "env"], optional = true }
anyhow = { workspace = true, optional = true }
png = { version = "0.18.1", default-features = false, optional = true }

[[bin]]
name = "aphrody-nie-runtime"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "nie-match3d"
path = "src/bin/match3d.rs"
required-features = ["cli"]
