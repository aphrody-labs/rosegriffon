[package]
name = "aphrody-nie-model-serve"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE.upstream"
publish = false
description = "Inazuma Eleven Victory Road model asset inspector and optional local HTTP service"

[lints]
workspace = true

[features]
default = []
host = [
  "dep:anyhow",
  "dep:clap",
  "dep:aphrody-nie-data",
  "dep:aphrody-nie-explore",
  "dep:aphrody-nie-sql",
  "dep:tokio",
  "dep:rusqlite",
  "dep:serde_json",
  "dep:sha2",
  "dep:tracing",
  "dep:tracing-subscriber",
  "aphrody-nie-formats/audio-decode",
  "aphrody-nie-formats/images",
]
real-audio = ["host"]

[dependencies]
aphrody-nie-formats = { path = "../aphrody-nie-formats", version = "1.4.8", default-features = false, features = ["std", "serde", "textures"] }
aphrody-nie-data = { path = "../aphrody-nie-data", version = "1.4.8", default-features = false, optional = true, features = ["serde", "std"] }
aphrody-nie-explore = { path = "../aphrody-nie-explore", version = "1.4.8", optional = true }
aphrody-nie-sql = { path = "../aphrody-nie-sql", version = "1.4.8", optional = true }
anyhow = { version = "1.0.104", default-features = false, optional = true }
clap = { version = "4.5", default-features = false, features = ["derive", "color", "env", "std"], optional = true }
serde_json = { version = "1.0.154", default-features = false, features = ["std"], optional = true }
serde = { version = "1.0.228", default-features = false, features = [
  "std",
  "derive",
] }
rusqlite = { workspace = true, optional = true }
tokio = { version = "1.49", default-features = false, features = ["rt", "net", "time", "sync"], optional = true }
sha2 = { version = "0.10", optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"], optional = true }

[[bin]]
name = "aphrody-nie-model-serve"
path = "src/main.rs"
required-features = ["host"]

# Diagnostics run against a local game install (NIE_GAME_DIR); no game data is shipped.
[[example]]
name = "diag_g4pkm_transforms"
required-features = ["host"]

[[example]]
name = "probe_g4tx_dds"
required-features = ["host"]

[dev-dependencies]
# `probe_g4tx_dds` names `image_dds::ImageFormat` directly.
image_dds = { version = "0.7", default-features = false }
