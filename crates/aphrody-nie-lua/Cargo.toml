[package]
name = "aphrody-nie-lua"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
description = "Lua 5.2 bytecode inspection, host runtime and analysis for Inazuma Eleven"

[lints]
workspace = true

[features]
default = []
host = ["vm", "analysis"]
vm = ["dep:mlua"]
analysis = ["dep:tree-sitter", "dep:tree-sitter-lua"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
serde = { version = "1.0.228", default-features = false, features = [
  "derive",
  "std",
] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
mlua = { version = "0.11", optional = true, features = ["lua52", "vendored"] }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }

# Tests and examples read real menu cfg.bin / VFS files. No `lua` feature on nie-formats:
# it would depend back on this crate.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
aphrody-nie-formats = { workspace = true, features = ["std"] }
aphrody-nie-data = { workspace = true }

[[test]]
name = "main_menu_inc"
required-features = ["vm"]

[[test]]
name = "menu_host_gap"
required-features = ["vm"]

[[test]]
name = "opcode_survey"
required-features = ["vm"]

[[example]]
name = "couverture_funclua"
required-features = ["vm"]

[[example]]
name = "probe_menu_script"
required-features = ["vm"]
