[package]
build = "build.rs"
name = "criware"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
description = "Canonical unified CRIWARE CPK, CRILAYLA, ACB, AWB, HCA, ADX, USM parser and encoder"

[lints]
workspace = true

[features]
default = ["std", "serde", "lua"]
std = ["dep:crc32fast", "crc32fast/std", "dep:tempfile"]
serde = ["dep:serde"]
lua = ["dep:aphrody-nie-lua"]
textures = ["std", "dep:image_dds", "dep:png"]
images = ["std", "dep:image", "dep:png"]
textures-encode = ["textures", "image_dds/encode"]
audio-decode = ["std", "dep:cridecoder"]
real-fixtures = ["std"]

[dependencies]
glam = { version = "0.33.9", default-features = false, features = ["std"] }
crc32fast = { version = "1.5", default-features = false, optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
aes = { version = "0.8", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
image_dds = { version = "0.7", default-features = false, optional = true }
png = { version = "0.18.1", default-features = false, optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "gif", "jpeg", "bmp", "tga", "tiff", "qoi"], optional = true }
cridecoder = { version = "0.2.3", default-features = false, optional = true }
tempfile = { version = "3.27.0", default-features = false, features = ["getrandom"], optional = true }
aphrody-nie-lua = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
png = { version = "0.18.1", default-features = false }

[[example]]
name = "g4tx_patch_region"
required-features = ["textures-encode"]

[[example]]
name = "menu_presentation_export"
required-features = ["textures"]

[[example]]
name = "model_glb_preview"
required-features = ["textures"]

[[example]]
name = "probe_g4tg"
required-features = ["textures"]

[[example]]
name = "probe_g4tg_swizzle"
required-features = ["textures"]

[[example]]
name = "export_tex_png"
required-features = ["textures"]
