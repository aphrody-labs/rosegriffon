[package]
name = "aphrody-nie-launcher"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false
description = "Native Rust launcher, save editor, and mod package manager for Inazuma Eleven: Victory Road"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.228", features = ["std", "derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
base64 = "0.23.1"
sha2 = "0.10.9"
hmac = "0.12"
pbkdf2 = "0.12"
aes-gcm = "0.10"
aes = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
rand = "0.10.1"

[dev-dependencies]
tempfile = "3.27.0"
