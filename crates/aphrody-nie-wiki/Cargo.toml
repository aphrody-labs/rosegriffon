[package]
name = "aphrody-nie-wiki"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false
description = "Explore IEVR game data from the SQLite mirror"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.228", features = ["std", "derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1.44"
redis = { version = "0.27.6", features = ["r2d2"] }
rand = "0.10.1"
