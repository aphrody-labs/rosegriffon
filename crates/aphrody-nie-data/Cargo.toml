[package]
name = "aphrody-nie-data"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE.upstream"
publish = false
description = "Static Inazuma Eleven Victory Road game-data schemas and reverse-engineering decoders"

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde"]
std = ["serde_json/std"]

[dependencies]
serde_json = { version = "1.0.154", default-features = false, features = [
  "alloc",
] }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"], optional = true }

[[bin]]
name = "export_passives"
path = "src/bin/export_passives.rs"
required-features = ["serde", "std"]

[[bin]]
name = "export_formations"
path = "src/bin/export_formations.rs"
required-features = ["serde", "std"]

[[bin]]
name = "export_skills"
path = "src/bin/export_skills.rs"
required-features = ["serde", "std"]

# `typed` sits behind the `serde` feature; these goldens declare it so a default-feature run
# skips them with an explicit reason instead of failing to compile.
[[test]]
name = "avatar_resolve_golden"
path = "tests/avatar_resolve_golden.rs"
required-features = ["serde"]

