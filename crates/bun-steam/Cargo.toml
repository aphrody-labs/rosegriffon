# SPDX-License-Identifier: Apache-2.0
[package]
name = "bun-steam"
version = "1.4.8"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-dev <contact@aphrody.com>"]
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "Bun OS Steam owner: VDF text/binary parser and writer, install and library discovery, client configuration, Proton launch tuning, Remote Play state."

[lib]
name = "bun_steam"

[lints]
workspace = true

[features]
default = []
depot = [
    "dep:anyhow", "dep:bytes", "dep:clap", "dep:dirs-next", "dep:hex",
    "dep:steamroom", "dep:steamroom-client", "dep:tokio", "dep:tracing",
    "dep:tracing-subscriber", "dep:zip"
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true, features = ["std"] }
anyhow = { workspace = true, optional = true, features = ["std"] }
bytes = { version = "1.12.1", optional = true }
clap = { version = "4", optional = true, features = ["derive", "color", "env"] }
dirs-next = { version = "2", optional = true }
hex = { version = "0.4", optional = true }
tokio = { version = "1.53.2", optional = true, features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tracing = { workspace = true, optional = true }
zip = { version = "8.6.0", optional = true, default-features = false, features = ["deflate"] }
steamroom = { version = "0.2", optional = true }
steamroom-client = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3.27.0"
