# rosegriffon.fr + www — bootstrap HTTP-only (Next.js standalone :3004, website-web.service).
# Installé au cutover AVANT certbot : permet le challenge ACME HTTP-01 + sert en clair
# le temps d'obtenir le cert. `certbot --nginx -d rosegriffon.fr -d www.rosegriffon.fr`
# réécrit ensuite ce fichier pour ajouter le 443/SSL + la redirection 80->443.
# Source de vérité en repo (scripts/rosegriffon.conf) ; copie dans /etc/nginx/conf.d/.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream website_web { server 127.0.0.1:3004; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name rosegriffon.fr www.rosegriffon.fr;

    # www -> apex (canonique : NEXT_PUBLIC_BASE_URL pointe www, mais SEO unifié sur l'apel ;
    # better-auth trustedOrigins couvre les deux. On NE redirige PAS ici pour rester neutre
    # avant certbot ; la redirection HTTPS sera gérée après émission du cert.)

    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 25m;

    # Statiques Next hashés servis directement par nginx (offload Bun, cache 1 an immutable)
    location /_next/static/ {
        alias /home/ubuntu/rg/apps/website/.next/standalone/apps/website/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @bunproxy;
    }
    location @bunproxy { proxy_pass http://website_web; proxy_set_header Host $host; }

    location / {
        proxy_pass http://website_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
