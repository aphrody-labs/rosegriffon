# Drop-in resilience azalee-web — auto-recovery « never give up ».
# `StartLimitIntervalSec=0` désactive le rate-limit de restart : sans ça, 5 crashs en
# 60s (StartLimitBurst) mettent le service en `failed` et il RESTE DOWN. On veut qu'il
# retente indéfiniment (combiné au watchdog qui couvre le « vivant mais figé »).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
