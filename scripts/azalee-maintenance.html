<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>Azalée revient dans un instant…</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(120% 120% at 50% 0%, #2D1F14 0%, #1A120D 60%, #120c08 100%);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:#F4E9DF; padding:24px; }
  .card { max-width:480px; width:100%; text-align:center;
    background:rgba(45,31,20,.55); border:1px solid rgba(248,156,90,.25);
    border-radius:28px; padding:40px 28px; backdrop-filter:blur(6px);
    box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .flower { font-size:54px; line-height:1; animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  h1 { margin:18px 0 8px; font-size:24px; color:#F89C5A; }
  p { margin:6px 0; font-size:15px; line-height:1.55; color:#D8C7B8; }
  .bar { margin:26px auto 4px; width:160px; height:6px; border-radius:99px;
    background:rgba(248,156,90,.18); overflow:hidden; }
  .bar i { display:block; height:100%; width:40%; border-radius:99px; background:#F89C5A;
    animation:slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0%{margin-left:-40%} 100%{margin-left:100%} }
  small { display:block; margin-top:18px; font-size:12px; color:#8a7867; }
</style>
</head>
<body>
  <main class="card">
    <div class="flower">&#127802;</div>
    <h1>Azalée se rafraîchit&hellip;</h1>
    <p>Le wiki redémarre et sera de retour dans quelques secondes.</p>
    <p>Cette page se recharge toute seule.</p>
    <div class="bar"><i></i></div>
    <small>azalee.rosegriffon.fr &middot; Rose Griffon</small>
  </main>
</body>
</html>
