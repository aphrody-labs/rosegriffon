# SPDX-License-Identifier: Apache-2.0
# Rose Griffon stack: website, core (API + Discord bots + ranked + cron), model-serve, nginx;
# optional cron service (profile cron-split).
# Images: infra/docker/Dockerfile. Runbook, cutover and rollback: infra/docker/README.md.
#
#   just deploy-stack            build on vps, `up -d --wait`, smoke checks (the only deploy entry)
#   docker compose config        validate
#
# Host layout (bind mounts, RG_SRV_ROOT defaults to /srv/rosegriffon):
#   game/ievr        game install, read-only here, written only by the steam-depot tool
#   steam            steam-depot home (login token), 0700
#   cdn/static       derived public assets, source for the R2/S3 sync
#   cache/nginx      nginx proxy cache
#   cache/model-serve  nie-model-serve GLB cache
#   state            rg-core state (/var/lib/rg-core: media, shared, disputes, ranked, backups)
#   nie              model-serve working dir (var/*.ndjson manifests)
#   log/nginx        nginx logs (rg-stats.log is read by the stats:achillea cron task)
# Runtime env: RG_ENV_FILE, default /etc/rosegriffon/rosegriffon.env (0600, never committed;
# names only in infra/docker/.env.example).
#
# Only nginx publishes a port (127.0.0.1:18080, behind the host nginx). Every other service
# sits on the internal `backend` network.

name: rosegriffon

x-env: &env
  env_file:
    - path: ${RG_ENV_FILE:-/etc/rosegriffon/rosegriffon.env}
      required: true

x-build: &build
  context: .
  dockerfile: infra/docker/Dockerfile
  secrets:
    - rg_env

x-common: &common
  restart: unless-stopped
  init: true
  networks: [backend]
  security_opt: ["no-new-privileges:true"]
  # Services reachable on the host loopback (e.g. REDIS_URL=redis://host.docker.internal:6379).
  extra_hosts: ["host.docker.internal:host-gateway"]
  logging:
    driver: local
    options: { max-size: "20m", max-file: "5" }

services:
  model-serve:
    <<: [*common, *env]
    image: ${RG_REGISTRY:-rosegriffon}/model-serve:${RG_TAG:-latest}
    build: { <<: *build, target: model-serve }
    environment:
      NIE_GAME_DIR: /data/game
      NIE_MODEL_SERVE_HOST: 0.0.0.0
      NIE_MODEL_SERVE_PORT: "8792"
      NIE_MODEL_CACHE_DIR: /var/cache/nie-model-serve
    volumes:
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/game/ievr:/data/game:ro
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/cache/model-serve:/var/cache/nie-model-serve
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/nie:/srv/nie
    deploy:
      resources:
        limits: { memory: 10g }

  core:
    <<: [*common, *env]
    image: ${RG_REGISTRY:-rosegriffon}/core:${RG_TAG:-latest}
    build: { <<: *build, target: core }
    # The Discord gateways (rg, azalee, achillea) and the unified API share one process:
    # the API reads the live gateway client, and the bot admin servers are relayed on :8810.
    hostname: core
    networks:
      backend:
        aliases: [api, bot]
    environment:
      RG_CORE_HOST: 0.0.0.0
      RG_CORE_PORT: "8810"
      # Cron stays in process by default: the bot subscribes to its task.done / tweets.signal
      # events (apps/rg-bot/src/lib/cron-ipc.ts) and no cross-process bus exists yet (Redis
      # is only a cache). RG_CORE_CRON=0 + `--profile cron-split` moves it to the cron service.
      RG_CORE_CRON: ${RG_CORE_CRON:-1}
      RG_CORE_MODELES: "0"
      NIE_MODEL_SERVE_URL: http://model-serve:8792
      NIE_MODEL_SERVE_BIN: ""
      RG_MEDIA_ROOT: /var/lib/rg-core/media
      CDN_STATIC_ROOT: /data/cdn
      ACHILLEA_BACKUP_DIR: /var/lib/rg-core/backups/achillea
      RANKED_STORAGE_DIR: /var/lib/rg-core/ranked
      RG_CRON_SHARED_ROOT: /var/lib/rg-core/shared
    volumes:
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/state:/var/lib/rg-core
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/cdn/static:/data/cdn
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/log/nginx:/var/log/nginx:ro
    shm_size: 512m
    depends_on:
      model-serve: { condition: service_healthy }
    stop_grace_period: 20s
    deploy:
      resources:
        limits: { memory: 4g }

  cron:
    <<: [*common, *env]
    image: ${RG_REGISTRY:-rosegriffon}/cron:${RG_TAG:-latest}
    build: { <<: *build, target: cron }
    # Opt-in until cron events have a cross-process bus (see RG_CORE_CRON on core).
    profiles: [cron-split]
    environment:
      RG_CRON_PORT: "8811"
      RG_MEDIA_ROOT: /var/lib/rg-core/media
      CDN_STATIC_ROOT: /data/cdn
      ACHILLEA_BACKUP_DIR: /var/lib/rg-core/backups/achillea
      RANKED_STORAGE_DIR: /var/lib/rg-core/ranked
      RG_CRON_SHARED_ROOT: /var/lib/rg-core/shared
      NIE_MODEL_SERVE_URL: http://model-serve:8792
    volumes:
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/state:/var/lib/rg-core
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/cdn/static:/data/cdn
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/log/nginx:/var/log/nginx:ro
    shm_size: 512m
    depends_on:
      core: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 3g }

  website:
    <<: [*common, *env]
    image: ${RG_REGISTRY:-rosegriffon}/website:${RG_TAG:-latest}
    build: { <<: *build, target: website }
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3100"
      NODE_ENV: production
    depends_on:
      core: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 4g }

  nginx:
    <<: *common
    image: nginxinc/nginx-unprivileged:${NGINX_VERSION:-1.29-alpine}
    read_only: true
    tmpfs: [/tmp]
    # Loopback only: the host nginx keeps TLS and the public 80/443 for every vhost on vps
    # (infra/docker/host-nginx/rosegriffon-stack.conf proxies the rosegriffon names here).
    ports:
      - "127.0.0.1:${RG_NGINX_PORT:-18080}:8080"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/docker/nginx/snippets:/etc/nginx/snippets:ro
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/cdn/static:/data/cdn:ro
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/state/media:/data/media:ro
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/cache/nginx:/var/cache/nginx
      - ${RG_SRV_ROOT:-/srv/rosegriffon}/log/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      core: { condition: service_healthy }
      website: { condition: service_healthy }
      model-serve: { condition: service_healthy }

  # --- profile "tools": on-demand jobs, owned by the Steam/CDN agent --------------------
  # Slot reserved for:
  #   steam-depot  infra/docker/steam-depot/ (crates/bun-steam, `bun-steam-depot`, static musl,
  #                Alpine). STEAM_HOME=/srv/rosegriffon/steam (0700), writes the game into
  #                ${RG_SRV_ROOT}/game/ievr. Run: docker compose --profile tools run --rm steam-depot
  #   cdn-sync     Bun.s3 push of ${RG_SRV_ROOT}/cdn/static to R2/S3.
  #                Run: docker compose --profile tools run --rm cdn-sync
  # Both use `profiles: [tools]`, `restart: "no"` and the `backend` network; neither publishes ports.
  # --- end of tools slot -----------------------------------------------------------------

networks:
  backend:
    name: rosegriffon-backend

secrets:
  # Build-time only: NEXT_PUBLIC_* for the website bundle, mounted in one RUN, never in a layer.
  rg_env:
    file: ${RG_ENV_FILE:-/etc/rosegriffon/rosegriffon.env}
