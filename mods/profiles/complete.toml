# IEVR modpack profile "complete": the Inazuma-Eleven-Fantasy collection (Shadorossa, VR-Framework) + Rose Griffon.
# Configuration only. Nothing here is installed; the mods stay in their own folders (the collection is a git
# submodule without a licence: never copied, merged or edited). Checked by: bun tools/ie/modpack-check.ts
# See README.md (same folder) for each conflict and how it is resolved.
schema = "yolo-re.modpack-profile/1"
name = "complete"
game = "Inazuma Eleven: Victory Road (PC, Steam)"
loader = "VR-Framework 3.15 (evt_loader / winmm.dll of the collection)"
checked = "2026-11-05"
# collection snapshot this profile was built against (submodule commit)
collection_commit = "031de201"

# VRFW is the base and always loads first.
pinned_first = "VRFW"

# 43 mods: the collection's own enabled.toml (43) minus DebugTools, plus RoseGriffon.
enabled = [
  "VRFW",
  # -- content and modes (upstream enabled.toml, all kept)
  "InazumaFantasy", "HissatsuRevamp", "InaRogue", "BattleBayDeluxe", "CareerMode", "ChronicleDeluxe",
  "ExtraOpenings", "LostCutscenes", "MissingVoice", "StrikersShots", "StrikersTitles", "IECross",
  "SynergiesReworked",
  # -- CharacterReforged + its 10 modules (TeamKeshinSummons needs SpiritStaminaPoints + AuraOverhaul,
  #    ClassicEquipment needs BetterEquipment: all on)
  "CharacterReforged", "AuraOverhaul", "BetterEquipment", "ClassicCards", "ClassicEquipment", "ClassicRecruitment",
  "ClassicTraining", "PersonalPassives", "SpiritStaminaPoints", "TeamKeshinSummons", "TransformationItems",
  # -- HissatsuReforged + its 2 modules
  "HissatsuReforged", "HissatsuEffects", "HissatsuLevelUp",
  # -- FootballReforged + its 11 modules (LegendaryAI is default_enabled = false in its module table; kept on as in
  #    the author's enabled.toml: harder AI is part of the "complete" experience; switch it off for a vanilla AI)
  "FootballReforged", "AIRoles", "Challenges", "DuelAuras", "Friendlies", "Furor", "GoalkeeperBarrier", "HomeStadium",
  "LegendaryAI", "Pressing", "SkillDuel", "StoppageTime",
  # -- interface
  "BetterUI", "BetterQoL",
  # -- our club pack
  "RoseGriffon",
]

# Load order: VRFW first, then last = highest priority (loads last, wins file / cell / sprite conflicts).
# Base: the collection's load_order.toml, kept as the author tested it, with three changes:
#   - DebugTools removed (excluded, below)
#   - better_menu removed (BetterMenu excluded, below)
#   - new_techniques (stale id, no such mod on disk) replaced by HissatsuRevamp, the mod built by
#     new_techniques_build.py; HissatsuRevamp was enabled upstream but missing from the order
# and RoseGriffon appended last so its title logo wins over InazumaFantasy's (see [[override]]).
# The loader still loads every `requires` target first; within that, this order decides who wins.
order = [
  "VRFW",
  "InazumaFantasy", "CareerMode", "ChronicleDeluxe", "BattleBayDeluxe", "StrikersShots", "LostCutscenes",
  "StrikersTitles", "ExtraOpenings", "MissingVoice", "SynergiesReworked", "HissatsuLevelUp", "HissatsuEffects",
  "HissatsuReforged", "ClassicEquipment", "BetterEquipment", "TransformationItems", "ClassicTraining",
  "ClassicRecruitment", "ClassicCards", "PersonalPassives", "TeamKeshinSummons", "SpiritStaminaPoints",
  "AuraOverhaul", "CharacterReforged", "AIRoles", "SkillDuel", "StoppageTime", "DuelAuras", "Pressing", "HomeStadium",
  "Challenges", "Friendlies", "LegendaryAI", "Furor", "GoalkeeperBarrier", "FootballReforged",
  "HissatsuRevamp",       # was "new_techniques" in the upstream order
  "BetterUI", "BetterQoL", "InaRogue", "IECross",
  "RoseGriffon",          # last: its logo02 sprites, mode-menu wallpaper and theme win
]

[sources]
# Folders scanned for mod.toml (modules inside CharacterReforged / FootballReforged / HissatsuReforged included).
roots = ["../Inazuma-Eleven-Fantasy", "../RoseGriffon"]


# ---- mods on disk that are not enabled ------------------------------------------------------------------------------

[[excluded]]
id = "DebugTools"
# Debug mod: its config.toml has [flags] all = true, which turns on every [[VRFW.DebugSwitch]] of every active mod
# (reveal_all, all_chains, free_gacha, InaRogue unlock_all / all_players / tools). Cheats, not content.
reason = "debug flags (unlock-all, free gacha, reveal-all) forced on for every mod; not part of a play profile"

[[excluded]]
id = "better_menu"
# Folder BetterMenu, version 0.7.32 of 2026-10-19, described by its author as a test mod; not in the author's
# enabled.toml. It requires vr_framework>=2.7.15 (VRFW's former id: satisfied) but replaces the main menu with a 3D
# clubhouse scene (content/menus/title_scene.toml, title_avatar.toml), hiding the mode-menu background that
# RoseGriffon's wallpaper (bg_title02_02) paints.
reason = "experimental test mod, off upstream; would hide RoseGriffon's mode-menu wallpaper"

# ---- documented, intended overrides (checked by modpack-check) ------------------------------------------------------

[[override]]
kind = "title_art"
winner = "RoseGriffon"
losers = ["InazumaFantasy"]
# Both say [VRFW.TitleArt] own = true. The flag only switches the framework's own title art off (VRFW
# vrfw_title_art.toml / vrfw_title_clouds.toml, `when *.VRFW.TitleArt.own == false`); two owners are fine as long
# as their sprites are ordered, see the image override below.
reason = "two title-art owners; framework art off either way; sprite winner decided by order"

[[override]]
kind = "image"
winner = "RoseGriffon"
losers = ["InazumaFantasy"]
# logo02 of title00_03_02 (press-start logo) and title02_01 (mode-menu logo), every language: RoseGriffon loads last
# and paints the Rose Griffon logo. InazumaFantasy keeps the rest of its title art: the press-start key art
# (bg_sky01_st, star layers, emptied characters) and the ending logo ed_logo01 (still the Inazuma Fantasy logo).
reason = "Rose Griffon logo on the title and mode menus; Inazuma Fantasy key art and ending logo kept"

# ---- option values this profile expects (set in Options > Mod options, or the loader's mod_options files) ----------

[options]
# Whole-match camera: Rose Griffon's broadcast camera owns it, BetterQoL's «Lateral» stays «Original».
"BetterQoL.camera" = 0
"RoseGriffon.broadcast_camera" = 1
# Interface theme: Rose Griffon (main) accent. Values 11..13 = rose_griffon accents (1..3 are VRFW's dark theme).
"theme_engine.ui_theme" = 11

[camera]
# BetterQoL.side and RoseGriffon.broadcast are both whole-match chase presets (VRFW.match_camera/1, same rows
# 58-61 / 0-3 / 12-15). Only one may be on. StrikersShots.shot / .chain are drive presets requested at priority 10
# during shots only and keep working over either.
owner = "RoseGriffon.broadcast"

[[camera.toggle]]
preset = "BetterQoL.side"
option = "BetterQoL.camera"
on = 1

[[camera.toggle]]
preset = "RoseGriffon.broadcast"
option = "RoseGriffon.broadcast_camera"
on = 1
