<p-floatlabel variant="on">
	<p-select
		fluid
		[options]="roles"
		optionLabel="label"
		optionValue="value"
		optionDisabled="disabled"
		[(ngModel)]="selected"
		(onChange)="onChange($event.value)"
		[filter]="true"
		[showClear]="true"
		inputId="roleSelect"
		appendTo="body"
		[disabled]="disabled"
	></p-select>
	<label for="roleSelect">Rôle</label>
</p-floatlabel>
