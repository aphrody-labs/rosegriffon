<p-dialog
	header="Candidater auprès d'un Clan"
	(onHide)="onDialogClose()"
	[modal]="true"
	[(visible)]="showDialog"
	[style]="{ 'min-width': '30rem' }"
>
	<div class="flex flex-col gap-4">
		@if (!targetClanId) {
		<app-searchbar
			class="justify-center"
			[multiple]="false"
			[searchFormControl]="searchFormControl"
			behaviour="select"
			searchType="clans"
		></app-searchbar>
		}
		<app-clan-tag-select [distinctionsFormControl]="distinctionsFormControl"></app-clan-tag-select>
	</div>
	<div class="flex justify-end mt-4 gap-2">
		<p-button
			label="Candidater"
			severity="primary"
			(click)="applyToClan()"
			[disabled]="!isApplicationValid()"
			[loading]="applicationLoading()"
		/>
		<p-button label="Annuler" severity="secondary" (click)="showDialog.set(false)" />
	</div>
</p-dialog>
