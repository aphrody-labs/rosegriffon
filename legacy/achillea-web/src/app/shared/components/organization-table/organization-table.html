<p-table
	[value]="sortOrganizationsByDate(organizations())"
	[loading]="organizationsAreLoading()"
	[scrollable]="true"
>
	<ng-template #header>
		<tr>
			@for (col of tableColumns; track col) {
			<th>{{ col.header }}</th>
			}
		</tr>
	</ng-template>
	<ng-template #body let-org>
		<tr>
			<td>
				<div class="flex items-center">
					<p-avatar class="mr-2" shape="circle" [image]="org.logo"></p-avatar>
					{{ org.name }}
				</div>
			</td>
			<td>
				<span [routerLink]="['/users', org.owner.id]" class="hover:underline cursor-pointer">
					{{ org.owner.username }}
				</span>
			</td>
			<td>
				<p-tag>
					<img
						[src]="lgSvc.getLanguageFromCode(org.origin)!.flag"
						[alt]="'flag_' + org.origin"
						class="inline-block w-5 h-3 mr-1 align-middle"
						loading="lazy"
						decoding="async"
					/>
					<span class="align-middle">{{ lgSvc.getLanguageFromCode(org.origin)!.language }}</span>
				</p-tag>
			</td>
			<td>{{ sqlDateToUsableDate(org.createdAt) | date:'longDate' }}</td>
			<td>
				@if (mode() === Mode.Validate) {
				<p-button
					[text]="true"
					severity="secondary"
					class="!shrink-0"
					label="Vérifier"
					icon="pi pi-list-check"
					[routerLink]="['/admins/dashboard/organizations/validate', org.id]"
					[pt]="{ icon: 'mt-[0.25rem]' }"
				/>
				}
			</td>
		</tr>
	</ng-template>
</p-table>
