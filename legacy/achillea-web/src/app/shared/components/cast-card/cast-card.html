<div
	class="flex flex-col items-center gap-3 p-4 rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 hover:shadow-md transition-shadow"
>
	<img
		[src]="avatarSrc"
		[alt]="caster.displayName"
		class="w-20 h-20 rounded-full object-cover border-2 border-surface-200 dark:border-surface-700"
		loading="lazy"
		decoding="async"
	/>

	<div class="flex flex-col items-center gap-1 w-full">
		<span class="font-semibold text-surface-900 dark:text-surface-0 text-center">
			{{ caster.displayName }}
		</span>

		@if (caster.bio) {
		<p class="text-xs text-surface-500 text-center line-clamp-2 m-0">{{ caster.bio }}</p>
		}
	</div>

	<div class="flex gap-2 items-center flex-wrap justify-center">
		<p-tag
			[value]="caster.recentCasts + ' cast' + (caster.recentCasts > 1 ? 's' : '') + ' récent' + (caster.recentCasts > 1 ? 's' : '')"
			severity="info"
		/>

		@if (caster.twitchUrl) {
		<a [href]="caster.twitchUrl" target="_blank" (click)="$event.stopPropagation()">
			<p-button
				icon="pi pi-twitch"
				[rounded]="true"
				[text]="true"
				severity="contrast"
				pTooltip="Voir sur Twitch"
				size="small"
			/>
		</a>
		}
	</div>
</div>
