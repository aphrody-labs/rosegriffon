<div class="flex flex-col gap-6">
	<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
		<p-card>
			<div class="flex flex-col gap-3">
				<div class="flex flex-col gap-1">
					<h3 class="text-lg font-semibold">Émettre une licence</h3>
					<p class="text-sm opacity-70">
						Crée une nouvelle licence pour un joueur via son identifiant Discord.
					</p>
				</div>
				<div class="flex flex-col gap-2">
					<label class="text-xs uppercase opacity-60">userId Discord</label>
					<input
						type="text"
						pInputText
						[ngModel]="issueUserId()"
						(ngModelChange)="issueUserId.set($event)"
						placeholder="Ex. 123456789012345678"
					/>
				</div>
				<p-button
					label="Émettre"
					icon="pi pi-id-card"
					styleClass="w-fit"
					[loading]="issuing()"
					[disabled]="!issueUserId().trim()"
					(onClick)="issue()"
				></p-button>
				@if (lastIssued(); as l) {
				<div class="flex items-center gap-2 text-sm">
					<p-tag severity="success" value="Émise"></p-tag>
					<span class="font-mono">{{ l.licenseNumber }}</span>
				</div>
				}
			</div>
		</p-card>

		<p-card>
			<div class="flex flex-col gap-3">
				<div class="flex flex-col gap-1">
					<h3 class="text-lg font-semibold">Révoquer une licence</h3>
					<p class="text-sm opacity-70">
						Invalide une licence existante via son identifiant de licence.
					</p>
				</div>
				<div class="flex flex-col gap-2">
					<label class="text-xs uppercase opacity-60">Identifiant de licence</label>
					<input
						type="text"
						pInputText
						[ngModel]="revokeId()"
						(ngModelChange)="revokeId.set($event)"
						placeholder="ID de la licence"
					/>
				</div>
				<p-button
					label="Révoquer"
					icon="pi pi-ban"
					severity="danger"
					styleClass="w-fit"
					[loading]="revoking()"
					[disabled]="!revokeId().trim()"
					(onClick)="revoke()"
				></p-button>
				@if (lastRevoked(); as l) {
				<div class="flex items-center gap-2 text-sm">
					<p-tag severity="danger" value="Révoquée"></p-tag>
					<span class="font-mono">{{ l.licenseNumber }}</span>
				</div>
				}
			</div>
		</p-card>
	</div>
</div>
