<!doctype html>
<html lang="fr" class="p-dark">
	<head>
		<meta charset="utf-8" />
		<title>Achillea</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="achillea_ico.png" />

		<!-- SEO / OpenGraph — aperçu sur rosegriffon.fr, Discord, Twitter… L'image est servie
		     sur /opengraph-image (rewrite nginx → /opengraph-image.png, 1200x630). -->
		<meta
			name="description"
			content="Le serveur central de la scène esport Inazuma Eleven: Victory Road — clans, tournois et ranked 1v1 / 2v2."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Achilléa" />
		<meta property="og:locale" content="fr_FR" />
		<meta property="og:title" content="Achilléa — Compétitif Inazuma Eleven" />
		<meta
			property="og:description"
			content="Le serveur central de la scène esport Inazuma Eleven: Victory Road — clans, tournois et ranked 1v1 / 2v2."
		/>
		<meta property="og:url" content="https://achillea.rosegriffon.fr/" />
		<meta property="og:image" content="https://achillea.rosegriffon.fr/opengraph-image" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Achilléa — Compétitif Inazuma Eleven" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@Achillea_IE" />
		<meta name="twitter:title" content="Achilléa — Compétitif Inazuma Eleven" />
		<meta
			name="twitter:description"
			content="Le serveur central de la scène esport Inazuma Eleven: Victory Road — clans, tournois et ranked 1v1 / 2v2."
		/>
		<meta name="twitter:image" content="https://achillea.rosegriffon.fr/opengraph-image" />

		<!-- Preconnect aux origines hot pour economiser 1 RTT TLS sur le 1er fetch -->
		<link rel="preconnect" href="https://ranked.rosegriffon.fr" crossorigin />
		<link rel="dns-prefetch" href="https://ranked.rosegriffon.fr" />
		<link rel="preconnect" href="https://cdn.discordapp.com" crossorigin />
		<link rel="dns-prefetch" href="https://cdn.discordapp.com" />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/brackets-viewer@1.9.1/dist/brackets-viewer.min.css"
		/>
		<script
			type="text/javascript"
			defer
			src="https://cdn.jsdelivr.net/npm/brackets-viewer@1.9.1/dist/brackets-viewer.min.js"
		></script>

		<!-- Données structurées réseau Rose Griffon : Organization (entité commune aux 3 sites,
		     même @id que website/azalee → Google fusionne les nœuds) + WebSite Achilléa. Le sameAs
		     liste les 3 domaines siblings et tous les réseaux sociaux du réseau, à l'identique sur
		     website / azalee / achillea, pour une entité Organization cohérente. -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "Organization",
						"@id": "https://rosegriffon.fr/#organization",
						"name": "Rose Griffon",
						"alternateName": "Association Rose Griffon",
						"url": "https://rosegriffon.fr",
						"logo": "https://rosegriffon.fr/RG_Logo_V2.5.webp",
						"description": "Association rassemblant la communauté Inazuma Eleven en France.",
						"sameAs": [
							"https://rosegriffon.fr",
							"https://azalee.rosegriffon.fr",
							"https://achillea.rosegriffon.fr",
							"https://x.com/rose_griffon",
							"https://x.com/Azalee_IE",
							"https://x.com/Achillea_IE",
							"https://www.youtube.com/@RoseGriffon",
							"https://twitch.tv/rose_griffontv",
							"https://www.instagram.com/rose_griffonfr",
							"https://www.instagram.com/azaleefr",
							"https://discord.gg/TYzQvbByv4",
							"https://disboard.org/server/1072991720268111892",
							"https://discord.do/fr/inazuma-eleven-fr-%E2%9A%BD-rose-griffon/"
						]
					},
					{
						"@type": "WebSite",
						"@id": "https://achillea.rosegriffon.fr/#website",
						"url": "https://achillea.rosegriffon.fr",
						"name": "Achilléa",
						"alternateName": "Achilléa — Compétitif Inazuma Eleven",
						"description": "Le serveur central de la scène esport Inazuma Eleven: Victory Road — clans, tournois et ranked 1v1 / 2v2.",
						"inLanguage": "fr-FR",
						"publisher": { "@id": "https://rosegriffon.fr/#organization" },
						"isPartOf": { "@id": "https://rosegriffon.fr/#organization" }
					}
				]
			}
		</script>
	</head>
	<body>
		<!-- Generated at build time and replaceable at runtime. It must load before Angular. -->
		<script src="achillea-config.js"></script>
		<script>
			(function () {
				var t = localStorage.getItem("achillea-theme");
				if (t === "light") {
					document.documentElement.classList.remove("p-dark");
					document.documentElement.classList.add("p-light");
				}
			})();
		</script>
		<app-root></app-root>
	</body>
</html>
