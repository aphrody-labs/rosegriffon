<div class="py-[0.5rem] px-[1rem] notif-border rounded-(--p-content-border-radius)">
	<div class="flex justify-between pb-[0.5rem]">
		<div class="flex gap-2">
			<p-tag
				[severity]="getTagColor(notification.category)"
				[value]="NotificationCategoryName[notification.category]"
			/>
			<h6 class="text-md content-center">{{notification.title}}</h6>
		</div>
		<div>
			<p-button
				icon="pi pi-bell-slash"
				[rounded]="true"
				[text]="true"
				severity="secondary"
				size="small"
				(onClick)="markAsRead(notification)"
			/>
		</div>
	</div>
	<p class="text-sm">{{truncate(notification.message)}}</p>
</div>
