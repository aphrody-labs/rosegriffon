<div
	class="flex flex-col gap-4 p-4 rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900"
>
	<div class="flex flex-col gap-1">
		<span class="font-semibold text-surface-900 dark:text-surface-0">{{ event.name }}</span>
		<span class="text-xs text-surface-500">
			{{ event.scheduledAt | date:'dd/MM/yyyy HH:mm' }}
		</span>
	</div>

	<div class="flex flex-col gap-1">
		<label class="text-sm font-medium">Ma disponibilité</label>
		<p-select
			[(ngModel)]="selectedStatus"
			[options]="statusOptions"
			optionLabel="label"
			optionValue="value"
			placeholder="Choisir..."
			class="w-full"
		/>
		@if (selectedStatus) {
		<p-tag
			[value]="castAvailabilityStatusLabel(selectedStatus)"
			[severity]="castAvailabilityStatusSeverity(selectedStatus)"
			class="self-start mt-1"
		/>
		}
	</div>

	<div class="flex flex-col gap-1">
		<label class="text-sm font-medium">Rôles préférés (optionnel)</label>
		<p-multiselect
			[(ngModel)]="selectedRoles"
			[options]="roleOptions"
			optionLabel="label"
			optionValue="value"
			placeholder="Sélectionner des rôles..."
			[showClear]="true"
			class="w-full"
		/>
	</div>

	<p-button
		label="Enregistrer ma disponibilité"
		icon="pi pi-save"
		[loading]="loading"
		(click)="onSubmit()"
		class="self-end"
	/>
</div>
