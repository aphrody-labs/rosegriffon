<footer class="footer">
	<!-- Une seule rangée : réseau (1 lien par site) + sociaux + copyright sans re-liens. -->
	<div class="footer-inner">
		<nav class="footer-nav" aria-label="Réseau Rose Griffon">
			<span class="footer-nav-label">Réseau</span>
			<a [href]="links.company" target="_blank" rel="noopener noreferrer">
				<img src="rg-logo.png" alt="" class="footer-icon" width="18" height="18" />
				Rose Griffon
			</a>
			<a [href]="links.sister" target="_blank" rel="noopener noreferrer">
				<img src="azalee-logo.png" alt="" class="footer-icon" width="18" height="18" />
				Wiki Azalée
			</a>
			<span class="footer-sep" aria-hidden="true"></span>
			<a [href]="links.discord" target="_blank" rel="noopener noreferrer" aria-label="Discord">
				<i class="pi pi-discord" aria-hidden="true"></i>
			</a>
			<a [href]="links.twitter" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
				<i class="pi pi-twitter" aria-hidden="true"></i>
			</a>
		</nav>

		<p class="footer-copy">© {{ currentYear }} Achilléa</p>
	</div>
</footer>
