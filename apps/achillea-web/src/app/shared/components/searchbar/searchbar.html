<p-iconfield class="flex flex-auto searchbar">
	<p-autoComplete
		[formControl]="searchFormControl"
		[suggestions]="suggestions()"
		fluid
		size="large"
		appendTo="body"
		[placeholder]="getPlaceholder()"
		[multiple]="multiple"
		(completeMethod)="query.set($event.query)"
	>
		<ng-template let-item #item>
			<div
				class="flex items-center gap-2 justify-between w-full"
				[routerLink]="getRouterLinkUrl(item)"
			>
				<div>
					@if (item.type === 'clan') {
					<p-tag value="Clan" severity="warn" />
					} @else {
					<p-tag value="Joueur" severity="info" />
					} @if (item.clanShortName) { [{{ item.clanShortName }}] {{ item.label }} } @else { {{
					item.label }} }
				</div>
				<div>
					@if (item.type === 'user' && item.soloRank?.key) {
					<p-tag>
						<img
							[src]="getEloImagePath(item.soloRank.key)"
							[alt]="item.soloRank.key"
							class="inline-block w-5 h-5 mr-1 align-middle"
							loading="lazy"
							decoding="async"
						/>
						<span class="align-middle">{{ item.soloRank.key }}</span>
					</p-tag>
					} @else if (item.type === 'clan' && item.avatar) {
					<img
						[alt]="item.label"
						[src]="item.avatar"
						class="inline-block w-7 h-7 align-middle border border-solid border-white rounded-[3px]"
						loading="lazy"
						decoding="async"
					/>
					}
				</div>
			</div>
		</ng-template>
	</p-autoComplete>
	<p-inputicon class="pi pi-search"></p-inputicon>
</p-iconfield>
