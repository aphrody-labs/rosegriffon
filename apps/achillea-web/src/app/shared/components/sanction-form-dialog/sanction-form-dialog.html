<p-dialog
	header="Nouvelle sanction"
	[(visible)]="visible"
	(visibleChange)="visibleChange.emit($event)"
	[modal]="true"
	[style]="{ 'min-width': '28rem' }"
>
	<form [formGroup]="form" class="flex flex-col gap-4 pt-2" (ngSubmit)="onSubmit()">
		<div class="flex flex-col gap-1">
			<label class="text-sm font-medium">ID Discord cible</label>
			<input
				pInputText
				formControlName="userId"
				placeholder="ex: 123456789012345678"
				class="w-full"
			/>
		</div>

		<div class="flex flex-col gap-1">
			<label class="text-sm font-medium">Type de sanction</label>
			<p-select
				formControlName="type"
				[options]="typeOptions"
				optionLabel="label"
				optionValue="value"
				placeholder="Choisir un type"
				class="w-full"
			/>
		</div>

		<div class="flex flex-col gap-1">
			<label class="text-sm font-medium">Raison</label>
			<textarea
				pTextarea
				formControlName="reason"
				rows="3"
				placeholder="Raison de la sanction..."
				class="w-full"
			></textarea>
		</div>

		@if (hasDuration) {
		<div class="flex flex-col gap-1">
			<label class="text-sm font-medium">Durée (secondes, optionnel)</label>
			<p-inputnumber
				formControlName="durationSec"
				[min]="60"
				placeholder="ex: 3600 = 1h"
				class="w-full"
			/>
		</div>
		}

		<div class="flex justify-end gap-2 pt-2">
			<p-button label="Annuler" severity="secondary" type="button" (click)="onClose()" />
			<p-button
				label="Créer la sanction"
				severity="danger"
				type="submit"
				[disabled]="form.invalid"
			/>
		</div>
	</form>
</p-dialog>
