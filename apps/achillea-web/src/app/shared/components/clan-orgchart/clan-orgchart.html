@if (areMembersLoading()) {
<div class="flex items-center">
	<p-progressSpinner></p-progressSpinner>
</div>
} @if (!areMembersLoading()) {
<p-organization-chart [value]="data" [collapsible]="true">
	<ng-template let-node pTemplate="person">
		<div class="flex flex-col hover:cursor-pointer" [routerLink]="['/users', node.data.id]">
			<div class="flex flex-col items-center">
				<p-avatar
					shape="circle"
					[image]="node.data.image"
					size="large"
					class="mb-4 w-12 h-12"
				></p-avatar>
				<span class="font-bold mb-2">{{ node.data.name }}</span>
				<span>{{ node.data.title }}</span>
			</div>
		</div>
	</ng-template>
</p-organization-chart>
}
