<div class="flex flex-col gap-3">
	<div class="flex flex-wrap items-end gap-2 justify-between">
		<div class="flex flex-wrap gap-2 items-end">
			<div class="flex flex-col gap-1">
				<label class="text-xs opacity-60" for="uq">Recherche</label>
				<input
					id="uq"
					pInputText
					[(ngModel)]="q"
					placeholder="pseudo / id"
					(keyup.enter)="page = 1; reload()"
				/>
			</div>
			<p-button
				label="Filtrer"
				icon="pi pi-search"
				size="small"
				(onClick)="page = 1; reload()"
			></p-button>
		</div>
		<p-button
			icon="pi pi-refresh"
			size="small"
			severity="secondary"
			[outlined]="true"
			[loading]="loading()"
			(onClick)="reload()"
		></p-button>
	</div>

	<p-table
		[value]="rows()"
		[loading]="loading()"
		[paginator]="true"
		[rows]="pageSize"
		[totalRecords]="total()"
		[lazy]="true"
		(onPage)="onPage($event)"
		styleClass="p-datatable-sm"
	>
		<ng-template pTemplate="header">
			<tr>
				<th>Joueur</th>
				<th>Rôle</th>
				<th>Dernière activité</th>
				<th class="text-right">Actions</th>
			</tr>
		</ng-template>
		<ng-template pTemplate="body" let-u>
			<tr>
				<td>
					<a [routerLink]="['/users', u.id]" class="font-medium hover:underline">
						{{ u.displayName || u.username || u.id }}
					</a>
					<div class="text-xs opacity-50 font-mono">{{ u.id }}</div>
				</td>
				<td>
					<p-tag [value]="roleLabel(u.role)" severity="secondary"></p-tag>
				</td>
				<td class="text-sm opacity-80">{{ u.lastInteract | date: "short" }}</td>
				<td class="text-right">
					<p-select
						[options]="roleOptions"
						optionLabel="label"
						optionValue="value"
						[ngModel]="u.role"
						(ngModelChange)="setRole(u, $event)"
						placeholder="Rôle"
						appendTo="body"
						styleClass="w-40"
					></p-select>
				</td>
			</tr>
		</ng-template>
		<ng-template pTemplate="emptymessage">
			<tr>
				<td colspan="4" class="text-center opacity-60 py-6">Aucun utilisateur.</td>
			</tr>
		</ng-template>
	</p-table>
</div>
