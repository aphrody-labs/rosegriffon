<div class="flex flex-col gap-3">
	<div class="flex items-center justify-between flex-wrap gap-2">
		<span class="text-sm opacity-70">{{ total() }} événement(s) cast</span>
		<div class="flex gap-2">
			<a routerLink="/casts" class="p-button p-button-sm p-button-outlined p-button-secondary">
				Vue publique
			</a>
			<p-button
				icon="pi pi-refresh"
				size="small"
				severity="secondary"
				[outlined]="true"
				[loading]="loading()"
				(onClick)="reload()"
			></p-button>
		</div>
	</div>

	<p-table [value]="events()" [loading]="loading()" styleClass="p-datatable-sm">
		<ng-template pTemplate="header">
			<tr>
				<th>Titre</th>
				<th>Statut</th>
				<th>Planifié</th>
				<th class="text-right">Planning</th>
			</tr>
		</ng-template>
		<ng-template pTemplate="body" let-e>
			<tr>
				<td class="font-medium">{{ e.title || e.name || e.id }}</td>
				<td><p-tag [value]="e.status" severity="info"></p-tag></td>
				<td class="text-sm">{{ e.scheduledAt | date: "short" }}</td>
				<td class="text-right">
					<a [routerLink]="['/casts', e.id, 'planning']" class="p-button p-button-text p-button-sm"
						>Ouvrir</a
					>
				</td>
			</tr>
		</ng-template>
		<ng-template pTemplate="emptymessage">
			<tr>
				<td colspan="4" class="text-center opacity-60 py-6">Aucun cast planifié.</td>
			</tr>
		</ng-template>
	</p-table>
</div>
