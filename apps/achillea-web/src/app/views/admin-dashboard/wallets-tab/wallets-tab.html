<div class="flex flex-col gap-6">
	<div class="flex justify-end">
		<p-button
			icon="pi pi-refresh"
			label="Actualiser"
			size="small"
			severity="secondary"
			[outlined]="true"
			[loading]="loading()"
			(onClick)="reload()"
		></p-button>
	</div>

	<section class="flex flex-col gap-2">
		<h4 class="m-0 text-sm font-semibold uppercase opacity-70">Top soldes</h4>
		<p-table [value]="top()" [loading]="loading()" styleClass="p-datatable-sm">
			<ng-template pTemplate="header">
				<tr>
					<th>Joueur</th>
					<th class="text-right">Solde</th>
					<th class="text-right">Action</th>
				</tr>
			</ng-template>
			<ng-template pTemplate="body" let-w>
				<tr>
					<td>
						<div class="font-medium">{{ w.displayName }}</div>
						<div class="text-xs font-mono opacity-50">{{ w.userId }}</div>
					</td>
					<td class="text-right font-mono tabular-nums">
						{{ w.balance | number: "1.0-2" }} {{ w.currency }}
					</td>
					<td class="text-right">
						<p-button
							icon="pi pi-pencil"
							size="small"
							[text]="true"
							(onClick)="openAdjust(w.userId)"
						></p-button>
					</td>
				</tr>
			</ng-template>
		</p-table>
	</section>

	<section class="flex flex-col gap-2">
		<h4 class="m-0 text-sm font-semibold uppercase opacity-70">Dernières transactions</h4>
		<p-table [value]="recent()" [loading]="loading()" styleClass="p-datatable-sm">
			<ng-template pTemplate="header">
				<tr>
					<th>Date</th>
					<th>Type</th>
					<th class="text-right">Montant</th>
					<th>Raison</th>
				</tr>
			</ng-template>
			<ng-template pTemplate="body" let-t>
				<tr>
					<td class="text-sm">{{ t.createdAt | date: "short" }}</td>
					<td>{{ t.type }}</td>
					<td class="text-right font-mono">{{ t.amount | number: "1.0-2" }}</td>
					<td class="text-sm opacity-80">{{ t.reason || "—" }}</td>
				</tr>
			</ng-template>
		</p-table>
	</section>
</div>

<p-dialog
	header="Ajuster le solde"
	[visible]="showAdjust()"
	(visibleChange)="showAdjust.set($event)"
	[modal]="true"
	[style]="{ width: '24rem' }"
>
	<div class="flex flex-col gap-3">
		<div class="text-xs font-mono opacity-60">{{ adjustUserId }}</div>
		<p-inputNumber
			[(ngModel)]="adjustAmount"
			placeholder="Montant (+ crédit / − débit)"
			[useGrouping]="false"
			styleClass="w-full"
		></p-inputNumber>
		<input pInputText [(ngModel)]="adjustReason" placeholder="Raison" class="w-full" />
		<p-button label="Appliquer" icon="pi pi-check" (onClick)="submitAdjust()"></p-button>
	</div>
</p-dialog>
