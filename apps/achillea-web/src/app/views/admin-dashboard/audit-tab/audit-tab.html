<div class="flex flex-col gap-3">
	<div class="flex justify-end">
		<p-button
			icon="pi pi-refresh"
			size="small"
			severity="secondary"
			[outlined]="true"
			[loading]="loading()"
			(onClick)="reload()"
		></p-button>
	</div>
	<p-table
		[value]="rows()"
		[loading]="loading()"
		styleClass="p-datatable-sm"
		[paginator]="true"
		[rows]="20"
	>
		<ng-template pTemplate="header">
			<tr>
				<th>Quand</th>
				<th>Action</th>
				<th>Acteur</th>
				<th>Cible</th>
				<th>Raison</th>
			</tr>
		</ng-template>
		<ng-template pTemplate="body" let-r>
			<tr>
				<td class="text-sm whitespace-nowrap">{{ r.ts | date: "short" }}</td>
				<td class="font-medium">{{ r.action }}</td>
				<td class="text-xs font-mono opacity-70">{{ r.actorId || "—" }}</td>
				<td class="text-sm">
					<span class="opacity-70">{{ r.targetType }}</span>
					@if (r.targetId) {
					<span class="font-mono text-xs"> · {{ r.targetId }}</span>
					}
				</td>
				<td class="text-sm opacity-80">{{ r.reason || "—" }}</td>
			</tr>
		</ng-template>
		<ng-template pTemplate="emptymessage">
			<tr>
				<td colspan="5" class="text-center opacity-60 py-6">Aucun log d'audit.</td>
			</tr>
		</ng-template>
	</p-table>
</div>
