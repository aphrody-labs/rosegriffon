# SPDX-License-Identifier: Apache-2.0
[package]
name = "steam-index"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Read-only Steam install indexer: emits metadata JSON and streams blake3 file hashes, using the bun-steam parsers."

# Standalone so the tool builds without touching the root workspace member list.
[workspace]

[dependencies]
bun-steam = { git = "https://github.com/aphrody-dev/steam-depot", rev = "a79da1ab5c3611ea23f0bc16f197a8bc4a9cf92c", package = "steam-depot" }
serde_json = "1"
blake3 = "1.8"
