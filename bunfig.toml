[install]
# Hoist deps autant que possible (vitesse + déduplication)
hoist = true
saveTextLockfile = true
exact = false

[install.cache]
# Chemin absolu — Bun n'expand PAS le ~ dans bunfig
dir = "/home/ubuntu/.bun/install/cache"

[install.scopes]
"@rg" = { url = "" }

[run]
# Permet d'utiliser bun comme task runner sans préfixe
bun = true
silent = false

[test]
coverage = false
